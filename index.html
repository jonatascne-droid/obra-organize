// chamada, guardamos aqui a moeda "atual" (da empresa logada) e toda chamada sem um
// segundo parâmetro explícito usa essa moeda automaticamente. setCurrentCurrencyCountry()
// é chamada sempre que os dados da empresa são carregados (AdminArea, CompanyDetail,
// EmployeeArea), antes da tela renderizar.
const CURRENCY_BY_COUNTRY = {
  BR: { code: 'BRL', locale: 'pt-BR' },
  ES: { code: 'EUR', locale: 'es-ES' },
  US: { code: 'USD', locale: 'en-US' },
};
let _currentCurrency = CURRENCY_BY_COUNTRY.ES;
const setCurrentCurrencyCountry = (country) => {
  _currentCurrency = CURRENCY_BY_COUNTRY[country] || CURRENCY_BY_COUNTRY.ES;
};
// Segundo parâmetro (country) é opcional — só é necessário quando se quer mostrar o
// valor de UMA empresa específica diferente da "atual" (ex: lista com várias empresas).
const fmtCurrency = (v, country) => {
  const c = country ? (CURRENCY_BY_COUNTRY[country] || CURRENCY_BY_COUNTRY.ES) : _currentCurrency;
  return new Intl.NumberFormat(c.locale, { style: 'currency', currency: c.code }).format(v || 0);
};
const CURRENCY_SYMBOL = { BR: 'R$', ES: '€', US: '$' };
const currentCurrencySymbol = () => {
  const entry = Object.entries(CURRENCY_BY_COUNTRY).find(([, c]) => c === _currentCurrency);
  return CURRENCY_SYMBOL[entry ? entry[0] : 'ES'];
};
// Qual ícone (dos ICONS) usar pra representar "dinheiro" — muda junto com a moeda da
// empresa (R$ pro Brasil, € pra Espanha, $ pros EUA), em vez de ficar sempre em €.
const CURRENCY_ICON = { BR: 'real', ES: 'euro', US: 'dollar' };
const currentCurrencyIcon = () => {
  const entry = Object.entries(CURRENCY_BY_COUNTRY).find(([, c]) => c === _currentCurrency);

};

// Mostra e-mail/senha de acesso de uma conta (uso exclusivo do programador)
const CredentialRow = ({ email, onResetPassword }) => {
  const [newPassword, setNewPassword] = useState(null);
  const [resetting, setResetting] = useState(false);
  const [copied, setCopied] = useState('');
  const copy = (text, which) => { if (text) { navigator.clipboard?.writeText(text); setCopied(which); setTimeout(() => setCopied(''), 2000); } };

  const handleReset = async () => {
    if (newPassword && !confirm('Isso gera uma senha nova e substitui a atual — o login com a senha anterior para de funcionar. Continuar?')) return;
    setResetting(true);
    const pw = await onResetPassword();
    setResetting(false);
    if (pw) setNewPassword(pw);
  };

  return (
    <div className="bg-slate-50 rounded-xl px-3 py-2 text-xs space-y-1.5 mb-3">
      <div className="flex items-center justify-between gap-2">

const CHART_FONT = { family: 'Inter', size: 12 };

function ChartCanvas({ config, height = 240 }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const configStr = JSON.stringify(config);
  const isMobile = window.innerWidth < 768;
  const actualHeight = isMobile ? Math.min(height, 180) : height;

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, config);
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [configStr]);

  return <div style={{ height: actualHeight }}><canvas ref={canvasRef}></canvas></div>;
}

function ResetPasswordPage({ onDone }) {
  const [password, setPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  setCurrentLocaleDirect(detectBrowserLocale());

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    if (password.length < 6) {
      setError(t('rst_erro_curta'));
      return;
    }
    if (password !== confirmPassword) {
      setError(t('rst_erro_diferentes'));
      return;
    }
    setLoading(true);
    const { error } = await db.auth.updateUser({ password });
    setLoading(false);
    if (error) { setError(error.message); return; }
    await db.auth.signOut();
    onDone();
  };

  return (
    <div className="min-h-screen bg-blueprint flex items-center justify-center p-4 relative overflow-hidden">
      <div className="absolute inset-0 bg-blueprint-grid bg-grid-24 opacity-50"></div>
      <div className="absolute -top-32 -right-32 w-96 h-96 bg-safety/20 rounded-full blur-3xl"></div>

      <div className="relative w-full max-w-md fade-in">
        <div className="text-center mb-8">
          <div className="inline-flex items-center gap-2 mb-3">
            <div className="w-10 h-10 bg-safety rounded-xl flex items-center justify-center">
              <Icon path={ICONS.building} className="w-5 h-5 text-white" />
            </div>
          </div>
          <h1 className="font-display text-3xl font-bold text-white">Obra Organize</h1>
          <p className="text-slate-400 text-sm mt-1">{t('rst_criar_senha')}</p>
        </div>

        <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-xl p-6 space-y-4">
          <Input label={t('rst_nova_senha')} type="password" required value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
          <Input label={t('rst_confirmar_senha')} type="password" required value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} placeholder="••••••••" />

            {loading ? t('rst_salvando') : t('rst_salvar')}

// mode: 'generic' (bilingual, com seletor de país/preço) | 'br' (fixo Brasil, português) | 'es' (fixo España, español) | 'us' (fixo EUA, inglês)
function LandingPage({ onBackToLogin, mode = 'generic' }) {
  const locale = mode === 'es' ? 'es' : mode === 'us' ? 'en' : 'pt';
  const t = LANDING_TEXT[locale];
  const forcedCountry = mode === 'br' ? 'BR' : mode === 'es' ? 'ES' : mode === 'us' ? 'US' : null;

  const [country, setCountry] = useState(forcedCountry || 'US');
  const [showSignup, setShowSignup] = useState(false);
  const [form, setForm] = useState({ company_name: '', contact_name: '', email: '', phone: '', password: '' });
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const [success, setSuccess] = useState(false);
  const [detectingLocation, setDetectingLocation] = useState(mode === 'generic');

  // Quando o modo muda (ex: o redirecionamento abaixo troca a URL de #planos pra #es/#br),
  // o React reaproveita essa MESMA instância do componente — o estado não reseta sozinho.
  // Por isso, sempre que sair do modo "genérico", garante que a tela de carregamento suma.
  useEffect(() => {
    if (mode !== 'generic') setDetectingLocation(false);
  }, [mode]);

  // Página genérica (#planos): detecta o país pelo IP e já manda direto pra #br ou #es,
  // pra pessoa não precisar escolher manualmente. Se a detecção falhar ou demorar demais
  // (rede, bloqueador etc.), mostra a página genérica normalmente como fallback.
  useEffect(() => {
    if (mode !== 'generic') return;
    let cancelled = false;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 3000);
    (async () => {
      try {
        const resp = await fetch('https://get.geojs.io/v1/ip/country.json', { signal: controller.signal });
        const data = await resp.json();
        if (cancelled) return;
        window.location.hash = data.country === 'BR' ? 'br' : data.country === 'US' ? 'us' : 'es';
      } catch (e) {
        if (!cancelled) setDetectingLocation(false);
      } finally {
        clearTimeout(timeout);
      }
    })();
    return () => { cancelled = true; clearTimeout(timeout); };
  }, [mode]);

  const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));

  const period = locale === 'en' ? '/mo' : locale === 'es' ? '/mes' : '/mês';
  const ALL_PLANS = [
    { code: 'US', name: locale === 'en' ? 'United States' : 'Estados Unidos', price: '$ 30', period },
    { code: 'ES', name: 'España', price: '€ 18', period },
    { code: 'BR', name: 'Brasil', price: 'R$ 45', period },
  ];
  const plans = forcedCountry ? ALL_PLANS.filter(p => p.code === forcedCountry) : ALL_PLANS;

  const handleSignup = async (e) => {
    e.preventDefault();
    setSaving(true);
    setError('');
    const { error: regError } = await db.rpc('public_register_company', {
      p_company_name: form.company_name,
      p_contact_name: form.contact_name,
      p_email: form.email,
      p_password: form.password,
      p_phone: form.phone,
      p_country: country,
    });
    if (regError) {
      setSaving(false);
      setError(regError.message || t.genericErr);
      return;
    }

    // Loga automaticamente com a conta recém-criada para poder abrir o checkout do Stripe.
    const { error: loginError } = await db.auth.signInWithPassword({ email: form.email, password: form.password });
    if (loginError) {
      // Conta foi criada, mas login automático falhou (raro). Segue para a tela de sucesso normal.
      setSaving(false);
      setSuccess(true);
      return;
    }

    try {
      const { data, error: checkoutError } = await db.functions.invoke('criar-checkout', {
        body: {
          success_url: window.location.origin + window.location.pathname,
          cancel_url: window.location.origin + window.location.pathname + '#' + (mode === 'generic' ? 'planos' : mode),
        },
      });
      if (!checkoutError && data?.url) {
        window.location.href = data.url;
        return; // navegação em andamento
      }
    } catch (err) {
      // Checkout do Stripe ainda não configurado ou falhou — cai no fluxo de cadastro pendente abaixo.
    }
    setSaving(false);
    setSuccess(true);
  };

  if (detectingLocation) {
    return (
      <div className="min-h-screen bg-blueprint flex items-center justify-center p-4">
        <div className="text-center">
          <div className="w-10 h-10 border-2 border-white/20 border-t-safety rounded-full animate-spin mx-auto mb-4"></div>
          <p className="text-slate-400 text-sm">Carregando...</p>
        </div>
      </div>
    );
  }

  if (success) {
    return (
      <div className="min-h-screen bg-blueprint flex items-center justify-center p-4">
        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center fade-in">

    );
  }

  return (

    // Painel cruza empresas de vários países ao mesmo tempo — não dá pra somar R$/€/$

    // cards antigos (ver seção "Visão financeira por moeda" abaixo, que trata isso direito).
    setCurrentCurrencyCountry('ES');
    const { data: companiesData } = await db.from('companies').select('*').order('created_at', { ascending: false });
    const { data: projects } = await db.from('projects').select('*');
    const { data: employees } = await db.from('employees').select('*');
    const { data: team } = await db.from('project_team').select('*');
    const { data: salaries } = await db.from('salary_payments').select('*');
    const { data: installments } = await db.from('payment_installments').select('*');

    setCompanies(companiesData || []);
    setAllProjects(projects || []);
    setStats(computeGlobalStats(projects || [], employees || [], team || [], salaries || [], installments || []));
    setMultiCurrency(computeMultiCurrencyStats(projects || [], companiesData || [], installments || []));
    setLoading(false);

    (async () => {
      try {
        const resp = await fetch('https://api.frankfurter.app/latest?from=EUR&to=USD,BRL');

function computeGlobalStats(projects, employees, team, salaries, installments = []) {
  const installmentsByProject = {};
  installments.forEach(i => { (installmentsByProject[i.project_id] ||= []).push(i); });

  const projectCounts = { a_iniciar: 0, em_andamento: 0, entregue: 0, atrasada: 0 };
  let totalBudget = 0, toReceive = 0, totalTax = 0;
  projects.forEach(p => {
    projectCounts[p.status] = (projectCounts[p.status] || 0) + 1;
    // Usa amount_to_receive como valor final (pode ter sido ajustado manualmente); cai no budget como fallback
    const finalValue = Number(p.amount_to_receive || p.budget || 0);
    totalBudget += finalValue;
    const installs = installmentsByProject[p.id];
    if (installs && installs.length > 0) {
      // Soma só o que ainda não foi recebido, respeitando parcelas já pagas individualmente
      installs.forEach(i => { if (i.status !== 'recebido') toReceive += Number(i.amount || 0); });
    } else if (!p.received) {
      toReceive += finalValue;
    }
    if (p.tax_passed_on && p.tax_amount) totalTax += Number(p.tax_amount);
  });

  let paidToTeams = 0, pendingToTeams = 0;
  team.forEach(t => {
    // Ignora linhas de "eu mesmo" (is_self) que não têm valor real
    if (t.is_self || t.payment_type === 'self') return;
    if (t.payment_status === 'pago') paidToTeams += Number(t.payment_value || 0);
    else pendingToTeams += Number(t.payment_value || 0);
  });
  salaries.forEach(s => {
    if (s.paid) paidToTeams += Number(s.amount || 0);
    else pendingToTeams += Number(s.amount || 0);
  });

  return {
    projects: projectCounts,
    totalBudget, toReceive,
    totalTax, netBudget: totalBudget - totalTax,
    totalEmployees: employees.length,
    registered: employees.filter(e => e.employment_type === 'registered').length,
    freelance: employees.filter(e => e.employment_type === 'freelance').length,
    paidToTeams, pendingToTeams,
  };
}

// Igual ao computeGlobalStats, mas separado por país/moeda — usado só no painel do
// programador (que mistura empresas do Brasil, Espanha e EUA ao mesmo tempo).
function computeMultiCurrencyStats(projects, companies, installments = []) {
  const countryByCompany = {};
  companies.forEach(c => { countryByCompany[c.id] = c.country || 'ES'; });

  const installmentsByProject = {};
  installments.forEach(i => { (installmentsByProject[i.project_id] ||= []).push(i); });

  const byCountry = { BR: { totalBudget: 0, toReceive: 0 }, ES: { totalBudget: 0, toReceive: 0 }, US: { totalBudget: 0, toReceive: 0 } };

  projects.forEach(p => {
    const country = countryByCompany[p.company_id] || 'ES';
    if (!byCountry[country]) return;
    const finalValue = Number(p.amount_to_receive || p.budget || 0);
    byCountry[country].totalBudget += finalValue;
    const installs = installmentsByProject[p.id];
    if (installs && installs.length > 0) {
      installs.forEach(i => { if (i.status !== 'recebido') byCountry[country].toReceive += Number(i.amount || 0); });
    } else if (!p.received) {
      byCountry[country].toReceive += finalValue;
    }
  });

  return byCountry;
}

// Converte um total (em cada moeda nativa) pra "quanto seria isso tudo somado numa
// moeda só" — nas três moedas. `rates` = quanto vale 1 EUR em USD e em BRL.
function convertSumToAllCurrencies({ BR, ES, US }, rates) {
  const totalEUR = ES + (BR / rates.BRL) + (US / rates.USD);
  return { EUR: totalEUR, USD: totalEUR * rates.USD, BRL: totalEUR * rates.BRL };
}

function CompanyFormModal({ company, onClose, onSaved }) {
  const isEdit = !!company;
  const [name, setName] = useState(company?.name || '');
  const [email, setEmail] = useState(company?.email || '');
  const [password, setPassword] = useState('');
  const [country, setCountry] = useState(company?.country || 'ES');
  const [taxRate, setTaxRate] = useState(company?.tax_rate != null ? String(company.tax_rate) : '');
  const [logoFile, setLogoFile] = useState(null);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');

  // Trocar o país muda o idioma dos orçamentos e reinicia a estimativa de imposto pra
  // regra do país novo — por isso, se já for uma empresa existente com dados, confirma antes.
  const handleCountryClick = (code) => {
    if (code === country) return;
    if (isEdit) {
      const ok = confirm('Ao trocar o país, o idioma dos orçamentos em PDF e a estimativa de imposto atual serão desativados e passam a seguir as regras do novo país. Deseja continuar?');
      if (!ok) return;
    }
    setCountry(code);
  };

  const uploadLogo = async (companyId) => {
    if (!logoFile) return null;
    const ext = logoFile.name.split('.').pop();
    const path = `${companyId}/${Date.now()}.${ext}`;
    const { error: upErr } = await db.storage.from('company-logos').upload(path, logoFile, { upsert: true });
    if (upErr) throw upErr;
    const { data } = db.storage.from('company-logos').getPublicUrl(path);
    return data.publicUrl;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSaving(true);
    setError('');
    try {
      if (isEdit) {
        let logoUrl = null;
        if (logoFile) logoUrl = await uploadLogo(company.id);
        const { error: updErr } = await db.rpc('update_company', {
          p_company_id: company.id,
          p_company_name: name !== company.name ? name : null,
          p_email: email !== company.email ? email : null,
          p_password: password || null,
          p_logo_url: logoUrl,
        });
        if (updErr) throw updErr;
        const { error: countryErr } = await db.from('companies').update({ country, tax_rate: taxRate !== '' ? parseFloat(taxRate) : null }).eq('id', company.id);
        if (countryErr) throw countryErr;
      } else {
        const { data: companyId, error: regErr } = await db.rpc('register_company', {
          p_company_name: name, p_email: email, p_password: password, p_logo_url: null,
        });
        if (regErr) throw regErr;
        const { error: countryErr } = await db.from('companies').update({ country, tax_rate: taxRate !== '' ? parseFloat(taxRate) : null }).eq('id', companyId);
        if (countryErr) throw countryErr;
        if (logoFile) {
          const logoUrl = await uploadLogo(companyId);
          await db.rpc('update_company', { p_company_id: companyId, p_company_name: null, p_email: null, p_password: null, p_logo_url: logoUrl });
        }
      }
      onSaved();
    } catch (err) {
      setError(err.message || 'Erro ao salvar empresa.');
    }
    setSaving(false);
  };

  return (
    <Modal title={isEdit ? 'Editar empresa' : 'Cadastrar empresa'} onClose={onClose}>
      <form onSubmit={handleSubmit} className="space-y-4">
        <Input label="Nome da empresa" required value={name} onChange={e => setName(e.target.value)} placeholder="Ex: Construtora Silva" />
        <Input label="E-mail de login (acesso do admin)" type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="empresa@email.com" />
        <Input label={isEdit ? "Nova senha (deixe em branco para não alterar)" : "Senha de acesso"} type="password" required={!isEdit} value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
        <div>
          <span className="block text-xs font-medium text-slate-500 mb-2">País de atuação <span className="text-slate-400 font-normal">(define o idioma de todo o sistema, do PDF, e a estimativa de imposto do orçamento)</span></span>
          <div className="grid grid-cols-3 gap-2">
            <button type="button" onClick={() => handleCountryClick('US')}
              className={`flex flex-col items-center gap-1 px-2 py-3 rounded-xl border-2 font-medium text-sm transition-colors ${country === 'US' ? 'border-safety bg-safety/5 text-safety' : 'border-slate-200 text-slate-600 hover:border-slate-300'}`}>
              <span className="text-base font-bold">US</span>
              <div className="text-center"><div>Estados Unidos</div><div className="text-xs font-normal text-slate-400">Sistema em inglês</div></div>
            </button>
            <button type="button" onClick={() => handleCountryClick('ES')}
              className={`flex flex-col items-center gap-1 px-2 py-3 rounded-xl border-2 font-medium text-sm transition-colors ${country === 'ES' ? 'border-safety bg-safety/5 text-safety' : 'border-slate-200 text-slate-600 hover:border-slate-300'}`}>
              <span className="text-base font-bold">ES</span>
              <div className="text-center"><div>España</div><div className="text-xs font-normal text-slate-400">Sistema em espanhol</div></div>
            </button>
            <button type="button" onClick={() => handleCountryClick('BR')}
              className={`flex flex-col items-center gap-1 px-2 py-3 rounded-xl border-2 font-medium text-sm transition-colors ${country === 'BR' ? 'border-safety bg-safety/5 text-safety' : 'border-slate-200 text-slate-600 hover:border-slate-300'}`}>
              <span className="text-base font-bold">BR</span>
              <div className="text-center"><div>Brasil</div><div className="text-xs font-normal text-slate-400">Sistema em português</div></div>
            </button>
          </div>
        </div>
        <div>
          <Input label="Alíquota de imposto aplicável (%)" type="number" step="0.01" min="0" max="100"
            value={taxRate} onChange={e => setTaxRate(e.target.value)} placeholder="(digite aqui o percentual da alíquota)" />
          <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">
            {country === 'ES'
              ? 'Usada para estimar o IVA nos orçamentos. 21% é a alíquota geral na Espanha; reformas residenciais podem ter direito a 10% em alguns casos — confirme com seu contador se aplica ao seu tipo de obra.'
              : country === 'US'
              ? 'Os EUA não têm uma alíquota única de imposto sobre serviço (o "sales tax" varia por estado e, em muitos estados, serviços de construção nem são tributados). Preencha aqui a alíquota efetiva do seu caso, confirmando com seu contador.'
              : 'O Brasil não tem uma alíquota única de imposto sobre serviço (ISS varia por município, e empresas do Simples Nacional têm alíquota própria conforme o faturamento). Preencha aqui a alíquota efetiva do seu caso, confirmando com seu contador.'}
            {' '}Deixe em branco se não quiser usar a estimativa de imposto nos orçamentos.
          </p>
        </div>
        <label className="block">
          <span className="block text-xs font-medium text-slate-500 mb-1.5">Logo da empresa (PNG, JPG ou PDF)</span>
          <div className="border-2 border-dashed border-slate-200 rounded-xl p-4 text-center hover:border-safety/50 transition-colors cursor-pointer relative">
            <input type="file" accept="image/png,image/jpeg,application/pdf" onChange={e => setLogoFile(e.target.files[0])} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
            <Icon path={ICONS.upload} className="w-5 h-5 mx-auto text-slate-400 mb-1" />
            <div className="text-sm text-slate-500">{logoFile ? logoFile.name : 'Clique para selecionar um arquivo'}</div>
          </div>
        </label>
        {error && <div className="text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2">{error}</div>}
        <div className="flex gap-2 pt-2">
          <Button type="submit" className="flex-1" disabled={saving}>{saving ? 'Salvando...' : 'Salvar'}</Button>
          <Button type="button" variant="outline" onClick={onClose}>Cancelar</Button>
        </div>
      </form>
    </Modal>
  );
}

function SubscriptionBanner() {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const goToCheckout = async () => {
    setLoading(true);
    setError('');
    const redirectBase = window.location.origin + window.location.pathname;
    const { data, error: err } = await db.functions.invoke('criar-checkout', {
      body: { success_url: `${redirectBase}?checkout=sucesso`, cancel_url: `${redirectBase}?checkout=cancelado` },
    });
    setLoading(false);
    if (err || !data?.url) { setError(t('sb_erro_checkout')); return; }
    window.location.href = data.url;
  };

  return (
    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-6 flex items-center justify-between flex-wrap gap-3">
      <div className="flex items-center gap-3">
        <div className="w-9 h-9 bg-amber-100 text-amber-700 rounded-xl flex items-center justify-center flex-shrink-0">
          <Icon path={ICONS[currentCurrencyIcon()]} className="w-5 h-5" />
        </div>
        <div>
          <div className="text-sm font-medium text-amber-900">{t('sb_titulo')}</div>
          <div className="text-xs text-amber-700">{t('sb_subtitulo')}</div>
        </div>
      </div>
      <div className="flex items-center gap-3">
        {error && <span className="text-xs text-red-600">{error}</span>}
        <Button onClick={goToCheckout} disabled={loading} className="!py-2 !px-4 text-sm">{loading ? t('sb_abrindo') : t('sb_finalizar')}</Button>
      </div>
    </div>
  );
}

function AdminArea({ profile, onLogout }) {

  const [paymentInstallments, setPaymentInstallments] = useState([]);
  const [notifications, setNotifications] = useState([]);
  const [noteNotifications, setNoteNotifications] = useState([]);
  const [loading, setLoading] = useState(true);

  const [editingEmployee, setEditingEmployee] = useState(null);

  const [showArchivedProjects, setShowArchivedProjects] = useState(false);

  const [editingCompany, setEditingCompany] = useState(false);
  const [financeiroAutoOpenProjectId, setFinanceiroAutoOpenProjectId] = useState(null);

  const loadData = async () => {
    const { data: companyData } = await db.from('companies').select('*').eq('id', profile.company_id).single();
    setCurrentCurrencyCountry(companyData?.country);
    setCurrentLocaleCountry(companyData?.country);
    const { data: employeesData } = await db.from('employees').select('*, profiles(email)').eq('company_id', profile.company_id).order('created_at', { ascending: false });
    const { data: projectsData } = await db.from('projects').select('*').eq('company_id', profile.company_id).order('created_at', { ascending: false });
    const { data: teamData } = await db.from('project_team').select('*').eq('company_id', profile.company_id);
    const { data: salaryData } = await db.from('salary_payments').select('*').eq('company_id', profile.company_id);
    const { data: installmentsData } = await db.from('payment_installments').select('*').eq('company_id', profile.company_id);
    const { data: notificationsData } = await db.from('value_change_requests')
      .select('*, employees(full_name), projects(title), project_team(payment_type)')
      .eq('company_id', profile.company_id)
      .order('created_at', { ascending: false });
    const { data: noteNotifsData } = await db.from('note_notifications')
      .select('*')
      .eq('recipient_profile_id', profile.id)
      .order('created_at', { ascending: false });
    const { data: svcData } = await db.from('company_services')
      .select('*').eq('company_id', profile.company_id).order('name');
    setCompany(companyData);
    setEmployees(employeesData || []);
    setProjects(projectsData || []);
    setProjectTeam(teamData || []);
    setSalaryPayments(salaryData || []);
    setPaymentInstallments(installmentsData || []);
    setNotifications(notificationsData || []);
    setNoteNotifications(noteNotifsData || []);
    setCompanyServices(svcData || []);
    setLoading(false);
  };

  useEffect(() => { loadData(); }, []);

  if (loading) return <Spinner />;

  const pendingCount = notifications.filter(n => n.status === 'pendente').length + noteNotifications.filter(n => !n.is_read).length;

  const navItems = [
    { key: 'dashboard', label: t('nav_dashboard'), icon: 'chart' },
    { key: 'obras', label: t('nav_obras'), icon: 'briefcase' },
    { key: 'equipe', label: t('nav_equipe'), icon: 'users' },
    { key: 'financeiro', label: t('nav_financeiro'), icon: 'euro' },
    { key: 'salarios', label: t('nav_salarios'), icon: 'euro' },
    { key: 'servicos', label: t('nav_servicos'), icon: 'briefcase' },
    { key: 'metragens', label: t('nav_metragens'), icon: 'ruler' },
    { key: 'notas-fiscais', label: t('nav_notas_fiscais'), icon: 'receipt' },
    { key: 'notificacoes', label: t('nav_notificacoes'), icon: 'bell', badge: pendingCount > 0 ? pendingCount : null },
  ];

  const stats = computeGlobalStats(projects, employees, projectTeam, salaryPayments, paymentInstallments);

  return (
    <AppShell
      title={company?.name || 'Empresa'}
      subtitle="Painel administrativo"
      logo={company?.logo_url}
      navItems={navItems}

      onNavigate={setPage}

              <ChartCanvas config={{

                          {t('notif_quer_alterar')(fmtCurrency(n.old_value), fmtCurrency(n.new_value))}
                        </div>
                        <div className="text-xs text-slate-400 mt-2">{new Date(n.created_at).toLocaleString(t('sal_locale'), { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </>
      )}

      {showEmployeeForm && (
        <EmployeeFormModal onClose={() => setShowEmployeeForm(false)} onSaved={() => { setShowEmployeeForm(false); loadData(); }} />
      )}

      {editingEmployee && (
        <EmployeeFormModal employee={editingEmployee} onClose={() => setEditingEmployee(null)} onSaved={() => { setEditingEmployee(null); loadData(); }} />
      )}

      {(showProjectForm || editingProject) && (
        <ProjectFormModal
          companyId={profile.company_id}
          company={company}
          employees={employees.filter(e => !e.archived)}
          profile={profile}
          companyServices={companyServices}
          editingProject={editingProject}
          onClose={() => { setShowProjectForm(false); setEditingProject(null); }}
          onSaved={() => { setShowProjectForm(false); setEditingProject(null); loadData(); }}
        />
      )}

      {viewingProject && (
        <ProjectDetailModal
          project={viewingProject}
          profile={profile}
          company={company}
          onClose={() => setViewingProject(null)}
          onChanged={(updated) => {
            setViewingProject(updated);
            loadData();
          }}
          onDeleted={() => { setViewingProject(null); loadData(); }}
          onEdit={(p) => { setViewingProject(null); setEditingProject(p); }}
          onGoToFinanceiro={(p) => { setViewingProject(null); setFinanceiroAutoOpenProjectId(p.id); setPage('financeiro'); }}
        />
      )}
      {viewingNotification && (
        <NotificationDetailModal
          notification={viewingNotification}
          onClose={() => setViewingNotification(null)}
          onResolved={() => { setViewingNotification(null); loadData(); }}
        />
      )}
      {viewingSalaryEmployee && (
        <SalaryHistoryModal
          employee={viewingSalaryEmployee}
          payments={salaryPayments.filter(s => s.employee_id === viewingSalaryEmployee.id)}
          onClose={() => setViewingSalaryEmployee(null)}
          onChanged={loadData}
        />
      )}

      {editingCompany && (
        <CompanyFormModal
          company={company}
          onClose={() => setEditingCompany(false)}
          onSaved={() => { setEditingCompany(false); loadData(); }}
        />
      )}
    </AppShell>
  );
}

function EmployeeFormModal({ employee, onClose, onSaved }) {
  const isEdit = !!employee;
  const employeeEmail = employee?.profiles?.email || employee?.email || '';
  const [form, setForm] = useState({
    full_name: employee?.full_name || '', email: employeeEmail, password: '',
    age: employee?.age || '', address: employee?.address || '', phone: employee?.phone || '',
    employment_type: employee?.employment_type || 'freelance',
    salary: employee?.salary || '', payment_day: employee?.payment_day || '',
  });
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const [emailExists, setEmailExists] = useState(false);
  const [checkingEmail, setCheckingEmail] = useState(false);

  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  // Verifica em tempo real (com debounce) se o e-mail já pertence a um usuário existente.
  // Só faz sentido para cadastro novo: ao editar, o colaborador já tem conta própria.
  useEffect(() => {
    if (isEdit) return;
    const email = form.email.trim();
    if (!email || !email.includes('@')) { setEmailExists(false); return; }
    setCheckingEmail(true);
    const timer = setTimeout(async () => {
      try {
        const { data, error } = await db.rpc('check_employee_email_exists', { p_email: email });
        if (!error) setEmailExists(!!data);
      } finally {
        setCheckingEmail(false);
      }
    }, 500);
    return () => clearTimeout(timer);
  }, [form.email, isEdit]);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSaving(true);
    setError('');

    if (isEdit) {
      const { error } = await db.rpc('update_employee', {
        p_employee_id: employee.id,
        p_full_name: form.full_name,
        p_phone: form.phone || null,
        p_age: form.age ? parseInt(form.age) : null,
        p_address: form.address || null,
        p_employment_type: form.employment_type,
        p_salary: form.employment_type === 'registered' && form.salary ? parseFloat(form.salary) : null,
        p_payment_day: form.employment_type === 'registered' && form.payment_day ? parseInt(form.payment_day) : null,
        p_email: form.email !== employeeEmail ? form.email : null,
        p_password: form.password || null,
      });
      if (error) { setError(error.message); setSaving(false); return; }
      onSaved();
      return;
    }

    const { error } = await db.rpc('register_employee', {
      p_full_name: form.full_name,
      p_email: form.email,
      p_password: emailExists ? null : form.password,
      p_age: form.age ? parseInt(form.age) : null,
      p_address: form.address || null,
      p_phone: form.phone || null,
      p_employment_type: form.employment_type,
      p_salary: form.employment_type === 'registered' && form.salary ? parseFloat(form.salary) : null,
      p_payment_day: form.employment_type === 'registered' && form.payment_day ? parseInt(form.payment_day) : null,
    });
    if (error) { setError(error.message); setSaving(false); return; }
    onSaved();
  };

  return (
    <Modal title={isEdit ? t('efm_title_editar') : t('efm_title_novo')} onClose={onClose} wide>
      <form onSubmit={handleSubmit} className="space-y-4">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <Input label={t('efm_nome_completo')} required value={form.full_name} onChange={set('full_name')} placeholder={t('efm_nome_ph')} />
          <Input label={t('efm_idade')} type="number" min="14" max="100" value={form.age} onChange={set('age')} placeholder="Ex: 32" />
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <Input label={t('efm_email_login')} type="email" required value={form.email} onChange={set('email')} placeholder="colaborador@email.com" />
            {!isEdit && checkingEmail && <div className="text-xs text-slate-400 mt-1">{t('efm_verificando_email')}</div>}
          </div>
          {(isEdit || !emailExists) && (
            <Input label={isEdit ? t('efm_nova_senha') : t('efm_senha_acesso')} type="password" required={!isEdit} value={form.password} onChange={set('password')} placeholder="••••••••" />
          )}
        </div>
        {!isEdit && emailExists && (
          <div className="text-sm text-blueprint bg-blueprint/5 border border-blueprint/10 rounded-xl px-3 py-2">
            {t('efm_email_existe')}
          </div>
        )}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <Input label={t('efm_telefone')} value={form.phone} onChange={set('phone')} placeholder="+34 600 000 000" />
          <Input label={t('efm_endereco')} value={form.address} onChange={set('address')} placeholder={t('efm_endereco_ph')} />
        </div>
        <Select label={t('efm_tipo_vinculo')} value={form.employment_type} onChange={set('employment_type')}>
          <option value="freelance">{t('efm_freelance_opt')}</option>
          <option value="registered">{t('efm_registrado_opt')}</option>
        </Select>
        {form.employment_type === 'registered' && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl">
            <Input label={t('efm_salario_mensal_curr')(currentCurrencySymbol())} type="number" step="0.01" required value={form.salary} onChange={set('salary')} placeholder="0,00" />
            <Input label={t('efm_dia_pagamento')} type="number" min="1" max="31" required value={form.payment_day} onChange={set('payment_day')} placeholder="Ex: 5" />
          </div>
        )}
        {error && <div className="text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2">{error}</div>}
        <div className="flex gap-2 pt-2">
          <Button type="submit" className="flex-1" disabled={saving}>{saving ? t('servicos_salvando') : (isEdit ? t('efm_salvar_alteracoes') : t('efm_title_novo'))}</Button>
          <Button type="button" variant="outline" onClick={onClose}>{t('nf_cancelar')}</Button>
        </div>
      </form>
    </Modal>
  );
}

function NotificationDetailModal({ notification, onClose, onResolved }) {
  const [adminNote, setAdminNote] = useState(notification.admin_note || '');
  const [saving, setSaving] = useState(false);

  const resolve = async (decision) => {
    setSaving(true);
    if (decision === 'aprovado') {
      await db.from('project_team').update({ payment_value: notification.new_value }).eq('id', notification.project_team_id);
    }
    await db.from('value_change_requests').update({
      status: decision,
      admin_note: adminNote || null,
      is_read: true,
      resolved_at: new Date().toISOString(),
    }).eq('id', notification.id);
    setSaving(false);
    onResolved();

  const paymentTypeLabels = { empreita: t('pricing_empreita'), diaria: t('pricing_diaria'), hora: t('pricing_hora'), salario: t('pricing_salario') };

  return (
    <Modal title={t('ndm_title')} onClose={onClose}>

          <div className="text-sm text-blueprint"><span className="text-slate-400">{t('ndm_obra')}</span> <span className="font-medium">{notification.projects?.title}</span></div>
          <div className="text-sm text-blueprint"><span className="text-slate-400">{t('ndm_tipo')}</span> <span className="font-medium">{paymentTypeLabels[notification.project_team?.payment_type] || '—'}</span></div>
        </div>

        <div className="flex items-center justify-center gap-4 py-2">
          <div className="text-center">
            <div className="text-xs text-slate-400 mb-1">{t('ndm_valor_atual')}</div>
            <div className="font-mono text-lg text-blueprint">{fmtCurrency(notification.old_value)}</div>
          </div>
          <Icon path={ICONS.chevron} className="w-5 h-5 text-slate-300" />
          <div className="text-center">
            <div className="text-xs text-slate-400 mb-1">{t('ndm_valor_solicitado')}</div>
            <div className="font-mono text-lg text-safety font-semibold">{fmtCurrency(notification.new_value)}</div>

        <TextArea label={t('ndm_nota_colaborador')} rows="3" value={adminNote} onChange={e => setAdminNote(e.target.value)}

        {notification.status === 'pendente' ? (

            <Button onClick={() => resolve('aprovado')} disabled={saving} className="flex-1"><Icon path={ICONS.check} className="w-4 h-4"/>{t('ndm_aprovar')}</Button>
            <Button onClick={() => resolve('negado')} disabled={saving} variant="danger" className="flex-1"><Icon path={ICONS.x} className="w-4 h-4"/>{t('ndm_negar')}</Button>
          </div>

          <div className={`text-sm font-medium px-3 py-2 rounded-xl text-center ${notification.status === 'aprovado' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}`}>
            {notification.status === 'aprovado' ? t('ndm_solicitacao_aprovada') : t('ndm_solicitacao_negada')}

        )}
      </div>
    </Modal>
  );
}

function currentMonthKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
}

function dueDateForEmployee(emp) {
  const d = new Date();
  const year = d.getFullYear(), month = d.getMonth();
  const lastDay = new Date(year, month + 1, 0).getDate();
  const day = Math.min(emp.payment_day || 1, lastDay);
  return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

function SalariosPage({ employees, salaryPayments, projectTeam, projects, companyId, onChanged, onViewHistory }) {
  const [viewingEmployee, setViewingEmployee] = useState(null);
  const [showArchived, setShowArchived] = useState(false);
  const monthKey = currentMonthKey();
  const monthLabel = new Date(monthKey + 'T00:00:00').toLocaleDateString(t('sal_locale'), { month: 'long', year: 'numeric' });

  const activeEmployees = employees.filter(e => !e.archived);
  const registeredActive = activeEmployees.filter(e => e.employment_type === 'registered');
  const freelanceActive = activeEmployees.filter(e => e.employment_type === 'freelance');
  const visibleEmployees = employees.filter(e => showArchived || !e.archived);
  const registered = visibleEmployees.filter(e => e.employment_type === 'registered');
  const freelance = visibleEmployees.filter(e => e.employment_type === 'freelance');

  const togglePaid = async (emp, e) => {
    e.stopPropagation();
    const current = salaryPayments.find(s => s.employee_id === emp.id && s.reference_month === monthKey);
    if (current) {
      const newPaid = !current.paid;
      await db.from('salary_payments').update({ paid: newPaid, paid_date: newPaid ? new Date().toISOString().slice(0, 10) : null }).eq('id', current.id);
    } else {
      await db.from('salary_payments').insert({
        employee_id: emp.id, company_id: companyId, reference_month: monthKey,
        amount: emp.salary, due_date: dueDateForEmployee(emp), paid: true, paid_date: new Date().toISOString().slice(0, 10),
      });
    }
    onChanged();
  };

  const totalSalaryPaid = registeredActive.reduce((sum, emp) => {
    const row = salaryPayments.find(s => s.employee_id === emp.id && s.reference_month === monthKey);
    return sum + (row?.paid ? Number(emp.salary || 0) : 0);
  }, 0);
  const totalSalaryPending = registeredActive.reduce((sum, emp) => {
    const row = salaryPayments.find(s => s.employee_id === emp.id && s.reference_month === monthKey);
    return sum + (!row?.paid ? Number(emp.salary || 0) : 0);
  }, 0);

  // Pagamentos freelance por projeto
  const freelancePaid = (projectTeam || []).filter(t => t.payment_status === 'pago' && !t.is_self).reduce((s, t) => s + Number(t.payment_value || 0), 0);
  const freelancePending = (projectTeam || []).filter(t => t.payment_status !== 'pago' && !t.is_self).reduce((s, t) => s + Number(t.payment_value || 0), 0);

  // Total geral
  const totalPaid = totalSalaryPaid + freelancePaid;
  const totalPending = totalSalaryPending + freelancePending;

  // Histórico últimos 6 meses
  const last6Months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    last6Months.push({
      key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`,
      label: `${getMonthNames()[d.getMonth()].slice(0, 3)}/${String(d.getFullYear()).slice(2)}`,
    });
  }
  const monthlyPaid = last6Months.map(m => salaryPayments.filter(s => s.reference_month === m.key && s.paid).reduce((sum, s) => sum + Number(s.amount || 0), 0));
  const monthlyPending = last6Months.map(m => salaryPayments.filter(s => s.reference_month === m.key && !s.paid).reduce((sum, s) => sum + Number(s.amount || 0), 0));
  const hasHistory = monthlyPaid.some(v => v > 0) || monthlyPending.some(v => v > 0);

  // Obras por colaborador
  const projectsByEmployee = (emp) => {
    const ids = new Set((projectTeam || []).filter(t => t.employee_id === emp.id).map(t => t.project_id));
    return (projects || []).filter(p => ids.has(p.id));
  };
  const totalEarnedByEmployee = (emp) => {
    return (projectTeam || []).filter(t => t.employee_id === emp.id && t.payment_status === 'pago').reduce((s, t) => s + Number(t.payment_value || 0), 0)
      + salaryPayments.filter(s => s.employee_id === emp.id && s.paid).reduce((s, sp) => s + Number(sp.amount || 0), 0);
  };
  const pendingByEmployee = (emp) => {
    const freelancePend = (projectTeam || []).filter(t => t.employee_id === emp.id && t.payment_status !== 'pago').reduce((s, t) => s + Number(t.payment_value || 0), 0);
    const salaryPend = salaryPayments.filter(s => s.employee_id === emp.id && !s.paid).reduce((s, sp) => s + Number(sp.amount || 0), 0);
    return freelancePend + salaryPend;
  };

  return (
    <>
      <PageHeader title={t('sal_title')} subtitle={t('sal_subtitle')(monthLabel)} />

      {/* Stats cards */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <StatCard icon="users" label={t('sal_total_equipe')} value={activeEmployees.length} sub={t('sal_total_equipe_sub')(registeredActive.length, freelanceActive.length)} />
        <StatCard icon={currentCurrencyIcon()} label={t('sal_total_pago')} value={fmtCurrency(totalPaid)} accent="safety" />
        <StatCard icon={currentCurrencyIcon()} label={t('sal_total_pendente')} value={fmtCurrency(totalPending)} />
        <StatCard icon="briefcase" label={t('sal_projetos_ativos')} value={(projects || []).filter(p => p.status === 'em_andamento').length} />
      </div>

      {/* Charts */}
      {(hasHistory || totalPaid > 0 || totalPending > 0) && (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
          <div className="md:col-span-2">
            <ChartCard title={t('sal_grafico_historico')}>
              <ChartCanvas config={{
                type: 'bar',
                data: {
                  labels: last6Months.map(m => m.label),
                  datasets: [
                    { label: t('sal_pago'), data: monthlyPaid, backgroundColor: '#22C55E', borderRadius: 6 },
                    { label: t('sal_pendente'), data: monthlyPending, backgroundColor: '#F59E0B', borderRadius: 6 },
                  ],
                },
                options: {
                  maintainAspectRatio: false,
                  plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 16 } } },
                  scales: { y: { beginAtZero: true, ticks: { callback: v => fmtCurrency(v) } } },
                },
              }} />
            </ChartCard>
          </div>
          <ChartCard title={t('sal_grafico_distribuicao')}>
            <ChartCanvas config={{
              type: 'doughnut',
              data: {
                labels: [t('sal_salarios_pagos'), t('sal_salarios_pendentes'), t('sal_freelance_pago'), t('sal_freelance_pendente')],
                datasets: [{ data: [totalSalaryPaid, totalSalaryPending, freelancePaid, freelancePending], backgroundColor: ['#22C55E', '#F59E0B', '#3B82F6', '#F97316'], borderWidth: 0 }],
              },
              options: {
                maintainAspectRatio: false,
                cutout: '60%',
                plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 10, font: { size: 10 } } } },
              },
            }} height={220} />
          </ChartCard>
        </div>
      )}

      {/* Registered employees — salary control */}
      <div className="flex items-center justify-between mb-4">
        <div />
        {employees.some(e => e.archived) && (
          <label className="flex items-center gap-2 text-sm text-slate-500 cursor-pointer">
            <input type="checkbox" checked={showArchived} onChange={e => setShowArchived(e.target.checked)} className="w-4 h-4 accent-safety rounded" />
            {t('sal_mostrar_arquivados')}
          </label>
        )}
      </div>
      {registered.length > 0 && (
        <div className="mb-8">
          <h2 className="font-display font-semibold text-lg mb-4">{t('sal_folha_titulo')(monthLabel)}</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {registered.map(emp => {
              const row = salaryPayments.find(s => s.employee_id === emp.id && s.reference_month === monthKey);
              const paid = row?.paid || false;
              return (
                <div key={emp.id} onClick={() => setViewingEmployee(emp)} className={`bg-white rounded-2xl border p-5 shadow-sm hover:shadow-md transition-shadow cursor-pointer ${emp.archived ? 'border-slate-200 opacity-60' : 'border-slate-100'}`}>
                  <div className="flex items-start justify-between mb-2">
                    <div className="font-display font-semibold text-blueprint">{emp.full_name}</div>
                    <div className="flex items-center gap-1.5">
                      {emp.archived && <span className="text-xs font-medium px-2.5 py-1 rounded-full border bg-slate-100 text-slate-500 border-slate-200">{t('equipe_arquivado')}</span>}
                      <span className={`text-xs font-medium px-2.5 py-1 rounded-full border ${paid ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-amber-50 text-amber-700 border-amber-300'}`}>
                        {paid ? t('sal_pago') : t('sal_pendente')}
                      </span>
                    </div>
                  </div>
                  <div className="text-xs text-slate-400 mb-1">{t('sal_dia_pagamento')(emp.payment_day)}</div>
                  <div className="text-xs text-slate-400 mb-3">{t('sal_obras_total_recebido')(projectsByEmployee(emp).length, fmtCurrency(totalEarnedByEmployee(emp)))}</div>
                  <div className="flex items-center justify-between gap-2">
                    <div className="font-mono text-lg text-blueprint">{fmtCurrency(emp.salary)}</div>
                    <label className="flex items-center gap-2 text-xs text-slate-500 cursor-pointer" onClick={e => e.stopPropagation()}>
                      <input type="checkbox" checked={paid} onChange={(e) => togglePaid(emp, e)} className="w-4 h-4 accent-safety rounded" />
                      {t('sal_marcar_pago')}
                    </label>
                    <div onClick={e => e.stopPropagation()}>
                      <ArchiveDeleteMenu
                        archived={emp.archived}
                        onArchive={async () => {
                          if (confirm(t('equipe_confirmar_arquivar')(emp.full_name))) {
                            await db.rpc('archive_employee', { p_employee_id: emp.id });
                            onChanged();
                          }
                        }}
                        onUnarchive={async () => {
                          await db.rpc('unarchive_employee', { p_employee_id: emp.id });
                          onChanged();
                        }}
                        onDelete={async () => {
                          if (confirm(t('equipe_confirmar_excluir')(emp.full_name))) {
                            await db.rpc('delete_employee', { p_employee_id: emp.id });
                            onChanged();
                          }
                        }}
                      />
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Freelance employees */}
      {freelance.length > 0 && (
        <div className="mb-8">
          <h2 className="font-display font-semibold text-lg mb-4">{t('sal_freelancers')}</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {freelance.map(emp => {
              const earned = totalEarnedByEmployee(emp);
              const pending = pendingByEmployee(emp);
              const empProjects = projectsByEmployee(emp);
              return (
                <div key={emp.id} onClick={() => setViewingEmployee(emp)} className={`bg-white rounded-2xl border p-5 shadow-sm hover:shadow-md transition-shadow cursor-pointer ${emp.archived ? 'border-slate-200 opacity-60' : 'border-slate-100'}`}>
                  <div className="flex items-start justify-between mb-2">
                    <div className="font-display font-semibold text-blueprint">{emp.full_name}</div>
                    <div className="flex items-center gap-1.5">

                      <div className="text-xs text-emerald-600 mb-0.5">{t('sal_recebido')}</div>
                      <div className="font-mono text-sm font-semibold text-emerald-700">{fmtCurrency(earned)}</div>
                    </div>
                    <div className="bg-amber-50 rounded-lg p-2">
                      <div className="text-xs text-amber-600 mb-0.5">{t('sal_pendente')}</div>
                      <div className="font-mono text-sm font-semibold text-amber-700">{fmtCurrency(pending)}</div>

                    <ArchiveDeleteMenu
                      archived={emp.archived}
                      onArchive={async () => {
                        if (confirm(t('equipe_confirmar_arquivar')(emp.full_name))) {
                          await db.rpc('archive_employee', { p_employee_id: emp.id });
                          onChanged();
                        }
                      }}
                      onUnarchive={async () => {
                        await db.rpc('unarchive_employee', { p_employee_id: emp.id });
                        onChanged();
                      }}
                      onDelete={async () => {
                        if (confirm(t('equipe_confirmar_excluir')(emp.full_name))) {
                          await db.rpc('delete_employee', { p_employee_id: emp.id });
                          onChanged();
                        }
                      }}
                    />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {employees.length === 0 && (
        <EmptyState icon="users" title={t('sal_vazio_titulo')} subtitle={t('sal_vazio_subtitulo')} />
      )}

      {/* Employee Dashboard Modal */}
      {viewingEmployee && (
        <EmployeeDashboardModal
          employee={viewingEmployee}
          salaryPayments={salaryPayments.filter(s => s.employee_id === viewingEmployee.id)}
          projectTeam={(projectTeam || []).filter(t => t.employee_id === viewingEmployee.id)}
          projects={projects || []}
          companyId={companyId}
          onClose={() => setViewingEmployee(null)}
          onViewFullHistory={() => { setViewingEmployee(null); onViewHistory(viewingEmployee); }}
        />
      )}
    </>
  );
}

// EMPLOYEE DASHBOARD MODAL — abre sem sair da página de Salários
// ============================================================
function EmployeeDashboardModal({ employee, salaryPayments, projectTeam, projects, companyId, onClose, onViewFullHistory }) {
  const myProjects = projects.filter(p => projectTeam.some(t => t.project_id === p.id));
  const completedProjects = myProjects.filter(p => p.status === 'entregue').length;
  const totalEarned = projectTeam.filter(t => t.payment_status === 'pago').reduce((s, t) => s + Number(t.payment_value || 0), 0)
    + salaryPayments.filter(s => s.paid).reduce((s, sp) => s + Number(sp.amount || 0), 0);
  const totalPending = projectTeam.filter(t => t.payment_status !== 'pago').reduce((s, t) => s + Number(t.payment_value || 0), 0)
    + salaryPayments.filter(s => !s.paid).reduce((s, sp) => s + Number(sp.amount || 0), 0);

  const last6 = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    last6.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`, label: `${getMonthNames()[d.getMonth()].slice(0, 3)}` });
  }
  const monthlyEarned = last6.map(m => salaryPayments.filter(s => s.reference_month === m.key && s.paid).reduce((sum, s) => sum + Number(s.amount || 0), 0));
  const hasChart = monthlyEarned.some(v => v > 0);

  const PAYMENT_TYPE_LABELS = { empreita: t('pricing_empreita'), diaria: t('pricing_diaria'), hora: t('pricing_hora'), salario: t('pricing_salario') };

  return (
    <Modal title={t('edm_title')(employee.full_name)} onClose={onClose} wide>
      <div className="space-y-5">
        {/* Header badge */}
        <div className="flex items-center gap-3 bg-slate-50 rounded-xl p-4">
          <div className="w-12 h-12 rounded-xl bg-blueprint/10 flex items-center justify-center text-blueprint font-display font-bold text-lg">
            {employee.full_name.charAt(0).toUpperCase()}
          </div>
          <div>
            <div className="font-display font-semibold text-blueprint">{employee.full_name}</div>
            <div className="text-xs text-slate-400">
              {employee.employment_type === 'registered' ? t('edm_registrado_info')(fmtCurrency(employee.salary), employee.payment_day) : t('equipe_freelance')}
            </div>
          </div>
        </div>

        {/* Stats */}
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div className="bg-white rounded-xl border border-slate-100 p-3 text-center">
            <div className="font-mono text-xl font-semibold text-blueprint">{myProjects.length}</div>
            <div className="text-xs text-slate-400 mt-0.5">{t('edm_obras_atribuidas')}</div>
          </div>
          <div className="bg-white rounded-xl border border-slate-100 p-3 text-center">
            <div className="font-mono text-xl font-semibold text-blueprint">{completedProjects}</div>
            <div className="text-xs text-slate-400 mt-0.5">{t('edm_obras_concluidas')}</div>
          </div>
          <div className="bg-emerald-50 rounded-xl border border-emerald-100 p-3 text-center">
            <div className="font-mono text-lg font-semibold text-emerald-700">{fmtCurrency(totalEarned)}</div>
            <div className="text-xs text-emerald-600 mt-0.5">{t('edm_total_recebido')}</div>
          </div>
          <div className="bg-amber-50 rounded-xl border border-amber-100 p-3 text-center">
            <div className="font-mono text-lg font-semibold text-amber-700">{fmtCurrency(totalPending)}</div>
            <div className="text-xs text-amber-600 mt-0.5">{t('edm_pendente')}</div>
          </div>
        </div>

        {/* Chart — only for registered with salary history */}
        {hasChart && (
          <ChartCard title={t('edm_grafico_salarios')}>
            <ChartCanvas config={{
              type: 'bar',
              data: {
                labels: last6.map(m => m.label),
                datasets: [{ label: t('fin_status_recebido'), data: monthlyEarned, backgroundColor: '#F2641A', borderRadius: 6 }],
              },
              options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, ticks: { callback: v => fmtCurrency(v) } } },
              },
            }} height={180} />
          </ChartCard>
        )}

        {/* Projects list */}
        {myProjects.length > 0 && (
          <div>
            <h4 className="font-display font-semibold text-sm mb-3">{t('edm_obras_vinculadas')}</h4>
            <div className="space-y-2">

// SALARY HISTORY MODAL (histórico de pagamentos de um colaborador)

function SalaryHistoryModal({ employee, payments, onClose, onChanged }) {
  const sorted = [...payments].sort((a, b) => b.reference_month.localeCompare(a.reference_month));

  const togglePaid = async (row) => {
    const newPaid = !row.paid;
    await db.from('salary_payments').update({ paid: newPaid, paid_date: newPaid ? new Date().toISOString().slice(0, 10) : null }).eq('id', row.id);
    onChanged();
  };

  return (
    <Modal title={t('shm_title')(employee.full_name)} onClose={onClose}>
      <div className="space-y-3">
        <div className="bg-slate-50 rounded-xl p-4 flex items-center justify-between">
          <div className="text-sm text-slate-500">{t('shm_salario_mensal')}</div>
          <div className="font-mono text-lg text-blueprint">{fmtCurrency(employee.salary)}</div>
        </div>
        {sorted.length === 0 ? (
          <div className="text-sm text-slate-400 text-center py-6">{t('shm_nenhum_pagamento')}</div>
        ) : (
          <div className="space-y-2">
            {sorted.map(row => {
              const ref = new Date(row.reference_month + 'T00:00:00');
              return (
                <label key={row.id} className="flex items-center justify-between gap-3 bg-white border border-slate-100 rounded-xl px-4 py-3 cursor-pointer">
                  <div className="flex items-center gap-3">
                    <input type="checkbox" checked={row.paid} onChange={() => togglePaid(row)} className="w-4 h-4 accent-safety rounded" />
                    <div>
                      <div className="text-sm font-medium text-blueprint">{getMonthNames()[ref.getMonth()]} {ref.getFullYear()}</div>
                      <div className="text-xs text-slate-400">{row.paid ? t('fpm_recebido_em')(fmtDate(row.paid_date)) : t('fpm_vencimento')(fmtDate(row.due_date))}</div>

                  </div>

                </label>
              );
            })}
          </div>
        )}
      </div>
    </Modal>
  );
}
