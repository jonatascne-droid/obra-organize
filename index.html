// FINANCEIRO PAGE — recebimentos, impostos e resumo de salários
// ============================================================
function FinanceiroPage({ projects, companyId, salarySummary, onChanged, autoOpenProjectId, onAutoOpenHandled, onOpenSalarios }) {
  const [viewingProject, setViewingProject] = useState(null);
  const [installmentsByProject, setInstallmentsByProject] = useState({});
  const [loading, setLoading] = useState(true);

  const loadInstallments = async () => {
    const { data } = await db.from('payment_installments').select('*').eq('company_id', companyId).order('installment_number');
    const grouped = {};
    (data || []).forEach(row => { (grouped[row.project_id] ||= []).push(row); });
    setInstallmentsByProject(grouped);
    setLoading(false);
  };

  useEffect(() => { loadInstallments(); }, []);

  useEffect(() => {
    if (autoOpenProjectId && !loading) {
      const proj = projects.find(p => p.id === autoOpenProjectId);
      if (proj) setViewingProject(proj);
      onAutoOpenHandled();
    }
  }, [autoOpenProjectId, loading]);

  useEffect(() => {
    if (viewingProject) {
      const fresh = projects.find(p => p.id === viewingProject.id);
      if (fresh && fresh !== viewingProject) setViewingProject(fresh);
    }
  }, [projects]);

  const activeProjects = projects.filter(p => !p.archived);
  const totalReceivable = activeProjects.reduce((s, p) => s + Number(p.amount_to_receive || p.budget || 0), 0);

  let totalReceived = 0, totalPending = 0, totalOverdue = 0;
  activeProjects.forEach(p => {
    const installs = installmentsByProject[p.id] || [];
    if (installs.length > 0) {
      installs.forEach(i => {
        const amt = Number(i.amount || 0);
        if (i.status === 'recebido') totalReceived += amt;
        else if (i.status === 'atrasada') totalOverdue += amt;
        else totalPending += amt;
      });
    } else {
      const amt = Number(p.amount_to_receive || p.budget || 0);
      if (p.received) totalReceived += amt; else totalPending += amt;
    }
  });

  const totalTax = activeProjects.reduce((s, p) => s + (p.tax_passed_on ? Number(p.tax_amount || 0) : 0), 0);
  const totalTaxAbsorbed = activeProjects.reduce((s, p) => s + (!p.tax_passed_on ? Number(p.tax_amount || 0) : 0), 0);
  const totalTaxCombined = totalTax + totalTaxAbsorbed;
  const netBudget = totalReceivable - totalTax;

  const statusFor = (p) => {
    const installs = installmentsByProject[p.id] || [];
    const total = installs.length;
    const receivedCount = installs.filter(i => i.status === 'recebido').length;
    const hasOverdue = installs.some(i => i.status === 'atrasada');
    if (total === 0) return p.received ? { label: t('fin_status_recebido'), color: 'bg-emerald-50 text-emerald-700 border-emerald-300' } : { label: t('fin_status_pendente'), color: 'bg-amber-50 text-amber-700 border-amber-300' };
    if (receivedCount === total) return { label: t('fin_status_recebido'), color: 'bg-emerald-50 text-emerald-700 border-emerald-300' };
    if (hasOverdue) return { label: t('fin_status_atrasado'), color: 'bg-red-50 text-red-700 border-red-300' };
    if (receivedCount > 0) return { label: `${receivedCount}/${total} ${t('fin_status_parcelas')}`, color: 'bg-amber-50 text-amber-700 border-amber-300' };
    return { label: total > 1 ? `${t('fin_status_pendente')} · ${total}x` : t('fin_status_pendente'), color: 'bg-amber-50 text-amber-700 border-amber-300' };
  };

  if (loading) return <Spinner />;

  return (
    <>
      <PageHeader title={t('fin_title')} subtitle={t('fin_subtitle')} />

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <StatCard icon={currentCurrencyIcon()} label={t('fin_total_orcamentos')} value={fmtCurrency(totalReceivable)} accent="safety" />
        <StatCard icon={currentCurrencyIcon()} label={t('fin_ja_recebido')} value={fmtCurrency(totalReceived)} />
        <StatCard icon={currentCurrencyIcon()} label={t('fin_pendente_recebimento')} value={fmtCurrency(totalPending)} />
        <StatCard icon={currentCurrencyIcon()} label={t('fin_parcelas_atraso')} value={fmtCurrency(totalOverdue)} />
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <StatCard icon={currentCurrencyIcon()} label={t('fin_imposto_repassado')} value={fmtCurrency(totalTax)} sub={t('fin_imposto_repassado_sub')} />
        <StatCard icon={currentCurrencyIcon()} label={t('fin_impostos_absorvidos')} value={fmtCurrency(totalTaxAbsorbed)} sub={t('fin_impostos_absorvidos_sub')} />
        <StatCard icon={currentCurrencyIcon()} label={t('fin_total_impostos')} value={fmtCurrency(totalTaxCombined)} sub={t('fin_total_impostos_sub')} />
        <StatCard icon={currentCurrencyIcon()} label={t('fin_valor_liquido')} value={fmtCurrency(netBudget)} accent="safety" sub={t('fin_valor_liquido_sub')} />
      </div>

      {totalTaxCombined > 0 && (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
          <ChartCard title={t('fin_grafico_titulo')}>
            <ChartCanvas config={{
              type: 'doughnut',
              data: {
                labels: [t('fin_valor_liquido_curto'), t('fin_imposto_repassado_curto'), t('fin_imposto_absorvido_curto')],
                datasets: [{
                  data: [netBudget, totalTax, totalTaxAbsorbed],
                  backgroundColor: ['#1E2B3C', '#F2641A', '#F59E0B'],
                  borderWidth: 0,
                }],
              },
              options: {
                maintainAspectRatio: false,
                cutout: '65%',
                plugins: {
                  legend: { position: 'bottom', labels: { boxWidth: 12, padding: 16 } },
                  tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${fmtCurrency(ctx.raw)}` } },
                },
              },
            }} />
          </ChartCard>
          <div className="flex flex-col gap-3 justify-center">
            <div className="bg-white rounded-2xl border border-slate-100 p-4 shadow-sm flex items-center justify-between">
              <div>
                <div className="text-xs text-slate-400 mb-1">{t('fin_valor_liquido_curto')}</div>
                <div className="font-mono text-lg font-semibold text-blueprint">{fmtCurrency(netBudget)}</div>
              </div>
              <div className="w-3 h-8 rounded-full bg-blueprint"></div>
            </div>
            <div className="bg-white rounded-2xl border border-slate-100 p-4 shadow-sm flex items-center justify-between">
              <div>
                <div className="text-xs text-slate-400 mb-1">{t('fin_imposto_repassado_curto')}</div>
                <div className="font-mono text-lg font-semibold text-safety">{fmtCurrency(totalTax)}</div>
              </div>
              <div className="w-3 h-8 rounded-full bg-safety"></div>
            </div>
            <div className="bg-white rounded-2xl border border-slate-100 p-4 shadow-sm flex items-center justify-between">
              <div>
                <div className="text-xs text-slate-400 mb-1">{t('fin_imposto_absorvido_curto')}</div>
                <div className="font-mono text-lg font-semibold text-amber-600">{fmtCurrency(totalTaxAbsorbed)}</div>
              </div>
              <div className="w-3 h-8 rounded-full bg-amber-500"></div>
            </div>
          </div>
        </div>
      )}

      {salarySummary && (
        <div className="mb-8">
          <div className="flex items-center justify-between mb-4">
            <h2 className="font-display font-semibold text-lg">{t('fin_equipe_salarios')}</h2>
            <button onClick={onOpenSalarios} className="text-xs text-safety font-medium hover:underline flex items-center gap-1">
              {t('fin_ver_salarios')} <Icon path={ICONS.chevron} className="w-3.5 h-3.5" />
            </button>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <StatCard icon={currentCurrencyIcon()} label={t('fin_pago_equipe')} value={fmtCurrency(salarySummary.totalPaid)} />
            <StatCard icon={currentCurrencyIcon()} label={t('fin_pendente_equipe')} value={fmtCurrency(salarySummary.totalPending)} />
          </div>
        </div>
      )}

      <h2 className="font-display font-semibold text-lg mb-4">{t('obras_title')}</h2>
      {activeProjects.length === 0 ? (
        <EmptyState icon={currentCurrencyIcon()} title={t('fin_obras_vazio_titulo')} subtitle={t('fin_obras_vazio_subtitulo')} />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {activeProjects.map(p => {
            const st = statusFor(p);
            return (
              <div key={p.id} onClick={() => setViewingProject(p)} className="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm hover:shadow-md transition-shadow cursor-pointer">
                <div className="flex items-start justify-between mb-2">
                  <div className="font-display font-semibold text-blueprint">{p.title}</div>
                  <span className={`text-xs font-medium px-2.5 py-1 rounded-full border flex-shrink-0 ${st.color}`}>{st.label}</span>
                </div>
                {p.client_name && <div className="text-xs text-slate-400 mb-3">{t('obras_cliente')}: {p.client_name}</div>}
                <div className="font-mono text-lg text-blueprint">{fmtCurrency(p.amount_to_receive || p.budget)}</div>
                {p.tax_passed_on && p.tax_amount > 0 && (
                  <div className="text-xs text-amber-600 mt-1">{t('fin_inclui_imposto')} {fmtCurrency(p.tax_amount)} {t('fin_de_imposto')}</div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {viewingProject && (
        <FinanceiroProjectModal
          project={viewingProject}
          installments={installmentsByProject[viewingProject.id] || []}
          companyId={companyId}
          onClose={() => setViewingProject(null)}
          onChanged={() => { loadInstallments(); onChanged(); }}
        />
      )}
    </>
  );
}

const INSTALLMENT_STATUS_LABELS = { a_receber: 'A receber', atrasada: 'Atrasada', recebido: 'Recebido' };
const INSTALLMENT_STATUS_COLORS = {
  a_receber: 'bg-amber-50 text-amber-700 border-amber-300',
  atrasada: 'bg-red-50 text-red-700 border-red-300',
  recebido: 'bg-emerald-50 text-emerald-700 border-emerald-300',
};

function FinanceiroProjectModal({ project, installments, companyId, onClose, onChanged }) {
  const [paymentMode, setPaymentMode] = useState(project.payment_mode || 'total');
  const [saving, setSaving] = useState(false);
  const [numInstallments, setNumInstallments] = useState(String(installments.length >= 2 ? installments.length : 3));
  const [firstDueDate, setFirstDueDate] = useState(installments[0]?.due_date || new Date().toISOString().slice(0, 10));
  const [downPayment, setDownPayment] = useState('');
  const [remainderDueDate, setRemainderDueDate] = useState('');
  const [splitRemainder, setSplitRemainder] = useState(false);
  const [remainderInstallments, setRemainderInstallments] = useState('2');
  const [remainderFirstDueDate, setRemainderFirstDueDate] = useState('');
  const [editingSummary, setEditingSummary] = useState(false);
  const [editServiceValue, setEditServiceValue] = useState('');
  const [editTaxRate, setEditTaxRate] = useState('');
  const [editingInstallmentId, setEditingInstallmentId] = useState(null);
  const [editInstAmount, setEditInstAmount] = useState('');
  const [editInstDate, setEditInstDate] = useState('');

  useEffect(() => {
    if (project.payment_mode === 'parcial' && installments.length >= 2) {
      setDownPayment(String(installments[0].amount));
      if (installments.length === 2) {
        setSplitRemainder(false);
        setRemainderDueDate(installments[1].due_date || '');
      } else {
        setSplitRemainder(true);
        setRemainderInstallments(String(installments.length - 1));
        setRemainderFirstDueDate(installments[1].due_date || '');
      }
    } else if (project.payment_mode === 'parcelado' && installments.length >= 2) {
      setNumInstallments(String(installments.length));
      setFirstDueDate(installments[0].due_date || '');
    }
  }, []);

  const total = Number(project.amount_to_receive || project.budget || 0);
  const serviceValue = Number(project.service_value ?? (total - Number(project.tax_amount || 0)));

  const startEditingSummary = () => {
    setEditServiceValue(String(serviceValue));
    setEditTaxRate(project.tax_rate_snapshot != null ? String(project.tax_rate_snapshot) : '');
    setEditingSummary(true);
  };

  const saveSummary = async () => {
    const newServiceValue = parseFloat(editServiceValue);
    if (isNaN(newServiceValue) || newServiceValue < 0) return;
    const newTaxRate = editTaxRate !== '' ? parseFloat(editTaxRate) : null;
    let newTotal = newServiceValue;
    let newTaxAmount = null;
    if (newTaxRate != null && !isNaN(newTaxRate)) {
      const rateFraction = newTaxRate / 100;
      if (project.tax_passed_on) {
        newTotal = rateFraction < 1 ? newServiceValue / (1 - rateFraction) : newServiceValue;
        newTaxAmount = newTotal - newServiceValue;
      } else {
        newTaxAmount = newServiceValue * rateFraction;
      }
    }
    if (installments.length > 0 && !confirm(t('fpm_confirmar_editar'))) {
      return;
    }
    setSaving(true);
    await db.from('projects').update({
      service_value: newServiceValue,
      tax_rate_snapshot: newTaxRate,
      tax_amount: newTaxAmount,
      amount_to_receive: newTotal,
      budget: newTotal,
    }).eq('id', project.id);
    setSaving(false);
    setEditingSummary(false);
    onChanged();
  };

  const syncReceivedFlag = async () => {
    const { data } = await db.from('payment_installments').select('status').eq('project_id', project.id);
    const rows = data || [];
    const allReceived = rows.length > 0 && rows.every(r => r.status === 'recebido');
    await db.from('projects').update({ received: allReceived, received_date: allReceived ? new Date().toISOString().slice(0, 10) : null }).eq('id', project.id);
  };

  const applyTotal = async () => {
    setSaving(true);
    await db.from('payment_installments').delete().eq('project_id', project.id);
    await db.from('payment_installments').insert({
      project_id: project.id, company_id: companyId, installment_number: 1,
      due_date: project.end_date || new Date().toISOString().slice(0, 10),
      amount: total, status: project.received ? 'recebido' : 'a_receber',
      received_date: project.received ? new Date().toISOString().slice(0, 10) : null,
    });
    await db.from('projects').update({ payment_mode: 'total' }).eq('id', project.id);
    setPaymentMode('total');
    await syncReceivedFlag();
    setSaving(false);
    onChanged();
  };

  const generateParcial = async () => {
    const dp = parseFloat(downPayment);
    if (isNaN(dp) || dp <= 0 || dp >= total) return;
    const remainder = total - dp;
    setSaving(true);
    await db.from('payment_installments').delete().eq('project_id', project.id);

    const rows = [
      { project_id: project.id, company_id: companyId, installment_number: 1, due_date: new Date().toISOString().slice(0, 10), amount: Math.round(dp * 100) / 100, status: 'a_receber' },
    ];

    if (splitRemainder) {
      const n = parseInt(remainderInstallments);
      if (!n || n < 2 || !remainderFirstDueDate) { setSaving(false); return; }
      const base = Math.floor((remainder / n) * 100) / 100;
      let sum = 0;
      for (let i = 0; i < n; i++) {
        const d = new Date(remainderFirstDueDate + 'T00:00:00');
        d.setMonth(d.getMonth() + i);
        const amount = i === n - 1 ? Math.round((remainder - sum) * 100) / 100 : base;
        sum += amount;
        rows.push({
          project_id: project.id, company_id: companyId,
          installment_number: i + 2,
          due_date: d.toISOString().slice(0, 10),
          amount, status: 'a_receber',
        });
      }
    } else {
      if (!remainderDueDate) { setSaving(false); return; }
      rows.push({ project_id: project.id, company_id: companyId, installment_number: 2, due_date: remainderDueDate, amount: Math.round(remainder * 100) / 100, status: 'a_receber' });
    }

    await db.from('payment_installments').insert(rows);
    await db.from('projects').update({ payment_mode: 'parcial', received: false, received_date: null }).eq('id', project.id);
    setSaving(false);
    onChanged();
  };

  const generateParcelado = async () => {
    const n = parseInt(numInstallments);
    if (!n || n < 2 || !firstDueDate) return;
    setSaving(true);
    await db.from('payment_installments').delete().eq('project_id', project.id);
    const base = Math.floor((total / n) * 100) / 100;
    const rows = [];
    let sum = 0;
    for (let i = 0; i < n; i++) {
      const d = new Date(firstDueDate + 'T00:00:00');
      d.setMonth(d.getMonth() + i);
      const amount = i === n - 1 ? Math.round((total - sum) * 100) / 100 : base;
      sum += amount;
      rows.push({
        project_id: project.id, company_id: companyId,
        installment_number: i + 1,
        due_date: d.toISOString().slice(0, 10),
        amount, status: 'a_receber',
      });
    }
    await db.from('payment_installments').insert(rows);
    await db.from('projects').update({ payment_mode: 'parcelado', received: false, received_date: null }).eq('id', project.id);
    setSaving(false);
    onChanged();
  };

  const updateInstallmentStatus = async (installment, newStatus) => {
    await db.from('payment_installments').update({
      status: newStatus,
      received_date: newStatus === 'recebido' ? new Date().toISOString().slice(0, 10) : null,
    }).eq('id', installment.id);
    await syncReceivedFlag();
    onChanged();
  };

  const startEditingInstallment = (inst) => {
    setEditInstAmount(String(inst.amount));
    setEditInstDate(inst.due_date || '');
    setEditingInstallmentId(inst.id);
  };

  const saveInstallment = async (inst) => {
    const newAmount = parseFloat(editInstAmount);
    if (isNaN(newAmount) || newAmount < 0) return;
    await db.from('payment_installments').update({
      amount: newAmount,
      due_date: editInstDate || null,
    }).eq('id', inst.id);
    setEditingInstallmentId(null);
    onChanged();
  };

  const deleteInstallment = async (inst) => {
    if (!confirm(t('fpm_confirmar_excluir_parcela'))) return;
    await db.from('payment_installments').delete().eq('id', inst.id);
    await syncReceivedFlag();
    onChanged();
  };

  const addManualInstallment = async () => {
    const nextNumber = installments.length > 0 ? Math.max(...installments.map(i => i.installment_number)) + 1 : 1;
    await db.from('payment_installments').insert({
      project_id: project.id, company_id: companyId,
      installment_number: nextNumber,
      due_date: new Date().toISOString().slice(0, 10),
      amount: 0, status: 'a_receber',
    });
    onChanged();
  };

  const modeBtn = (key, label) => (
    <button type="button" onClick={() => setPaymentMode(key)}
      className={`px-3 py-2.5 rounded-xl border-2 text-sm font-medium transition-colors ${paymentMode === key ? 'border-safety bg-safety/5 text-safety' : 'border-slate-200 text-slate-600 hover:border-slate-300'}`}>
      {label}
    </button>
  );

  return (
    <Modal title={t('fpm_title')(project.title)} onClose={onClose}>
      <div className="space-y-4">
        <div className="bg-slate-50 rounded-xl p-4 space-y-1.5 text-sm">
          {editingSummary ? (
            <>
              <div className="flex items-center justify-between gap-3">
                <span className="text-slate-500 flex-shrink-0">{t('fpm_valor_servico_curr')(currentCurrencySymbol())}</span>
                <input type="number" step="0.01" value={editServiceValue} onChange={e => setEditServiceValue(e.target.value)}
                  className="w-32 px-2.5 py-1 rounded-lg border border-safety text-sm font-mono text-blueprint text-right focus:outline-none focus:ring-2 focus:ring-safety/30" />
              </div>
              <div className="flex items-center justify-between gap-3">
                <span className="text-slate-500 flex-shrink-0">{t('fpm_aliquota_pct')}</span>
                <input type="number" step="0.01" value={editTaxRate} onChange={e => setEditTaxRate(e.target.value)} placeholder={t('fpm_sem_imposto')}
                  className="w-32 px-2.5 py-1 rounded-lg border border-safety text-sm font-mono text-blueprint text-right focus:outline-none focus:ring-2 focus:ring-safety/30" />
              </div>
              <p className="text-xs text-slate-400 pt-1">{t('fpm_aliquota_ajuda')}</p>
              <div className="flex gap-2 pt-2">
                <Button onClick={saveSummary} disabled={saving} className="flex-1 !py-2 text-sm">{saving ? t('servicos_salvando') : t('fpm_salvar')}</Button>
                <Button variant="outline" onClick={() => setEditingSummary(false)} className="!py-2 text-sm">{t('fpm_cancelar')}</Button>
              </div>
            </>
          ) : (
            <>
              <div className="flex items-center justify-between">
                <span className="text-slate-500">{t('pf_valor_servico')}</span>
                <span className="font-mono text-blueprint">{fmtCurrency(serviceValue)}</span>
              </div>
              {project.tax_passed_on && project.tax_amount > 0 && (
                <div className="flex items-center justify-between text-amber-600">
                  <span>{t('fpm_imposto_repassado_pct')(project.tax_rate_snapshot)}</span>
                  <span className="font-mono">{fmtCurrency(project.tax_amount)}</span>
                </div>
              )}
              {!project.tax_passed_on && project.tax_amount > 0 && (
                <div className="flex items-center justify-between text-amber-600">
                  <span>{t('fpm_imposto_absorvido_pct')(project.tax_rate_snapshot)}</span>
                  <span className="font-mono">{fmtCurrency(project.tax_amount)}</span>
                </div>
              )}
              <div className="flex items-center justify-between font-semibold text-blueprint pt-1.5 border-t border-slate-200">
                <span>{t('fpm_total_receber')}</span>
                <span className="font-mono">{fmtCurrency(total)}</span>
              </div>
              <button onClick={startEditingSummary} className="text-xs text-safety font-medium hover:underline flex items-center gap-1 pt-1.5">
                <Icon path={ICONS.edit} className="w-3.5 h-3.5" /> {t('fpm_editar_valor_aliquota')}
              </button>
            </>
          )}
        </div>

        <div>
          <span className="block text-xs font-medium text-slate-500 mb-2">{t('fpm_forma_recebimento')}</span>
          <div className="grid grid-cols-3 gap-2">
            {modeBtn('total', t('fpm_total'))}
            {modeBtn('parcial', t('fpm_parcial'))}
            {modeBtn('parcelado', t('fpm_parcelado'))}
          </div>
        </div>

        {paymentMode === 'total' && project.payment_mode !== 'total' && (
          <div className="bg-amber-50/60 border border-amber-100 rounded-xl p-4 space-y-3">
            <p className="text-xs text-slate-500">{t('fpm_total_texto')}</p>
            <Button onClick={applyTotal} disabled={saving} className="w-full">{saving ? t('fpm_aplicando') : t('fpm_aplicar_total')}</Button>
          </div>
        )}

        {paymentMode === 'parcial' && (
          <div className="bg-amber-50/60 border border-amber-100 rounded-xl p-4 space-y-3">
            <p className="text-xs text-slate-500">{t('fpm_parcial_texto')}</p>
            <Input label={t('fpm_valor_entrada_curr')(currentCurrencySymbol())} type="number" step="0.01" value={downPayment} onChange={e => setDownPayment(e.target.value)} placeholder="0,00" />
            {downPayment && parseFloat(downPayment) > 0 && parseFloat(downPayment) < total && (
              <div className="text-xs text-slate-500">{t('fpm_restante')}: <span className="font-mono text-blueprint">{fmtCurrency(total - parseFloat(downPayment))}</span></div>
            )}

            <label className="flex items-center gap-2 text-sm text-slate-600 cursor-pointer pt-1">
              <input type="checkbox" checked={splitRemainder} onChange={e => setSplitRemainder(e.target.checked)} className="w-4 h-4 accent-safety rounded" />
              {t('fpm_parcelar_restante')}
            </label>

            {splitRemainder ? (
              <div className="grid grid-cols-2 gap-3">
                <Input label={t('fpm_num_parcelas_restante')} type="number" min="2" value={remainderInstallments} onChange={e => setRemainderInstallments(e.target.value)} />
                <Input label={t('fpm_vencimento_1a_parcela')} type="date" value={remainderFirstDueDate} onChange={e => setRemainderFirstDueDate(e.target.value)} />
              </div>
            ) : (
              <Input label={t('fpm_vencimento_restante')} type="date" value={remainderDueDate} onChange={e => setRemainderDueDate(e.target.value)} />
            )}

            {splitRemainder && downPayment && parseFloat(downPayment) > 0 && parseFloat(downPayment) < total && remainderInstallments && parseInt(remainderInstallments) >= 2 && (
              <div className="text-xs text-slate-500">
                {t('fpm_restante_em_x')(parseInt(remainderInstallments))} <span className="font-mono text-blueprint">{fmtCurrency((total - parseFloat(downPayment)) / parseInt(remainderInstallments))}</span>
              </div>
            )}

            <Button onClick={generateParcial} disabled={saving} className="w-full">{saving ? t('fpm_gerando') : t('fpm_gerar_recebimento_parcial')}</Button>
          </div>
        )}

        {paymentMode === 'parcelado' && (
          <div className="bg-amber-50/60 border border-amber-100 rounded-xl p-4 space-y-3">
            <p className="text-xs text-slate-500">{t('fpm_parcelado_texto')}</p>
            <div className="grid grid-cols-2 gap-3">
              <Input label={t('fpm_numero_parcelas')} type="number" min="2" value={numInstallments} onChange={e => setNumInstallments(e.target.value)} />
              <Input label={t('fpm_vencimento_1a_parcela')} type="date" value={firstDueDate} onChange={e => setFirstDueDate(e.target.value)} />
            </div>
            {numInstallments && parseInt(numInstallments) >= 2 && (
              <div className="text-xs text-slate-500">
                {t('fpm_x_de_aproximadamente')(parseInt(numInstallments))} <span className="font-mono text-blueprint">{fmtCurrency(total / parseInt(numInstallments))}</span>
              </div>
            )}
            <Button onClick={generateParcelado} disabled={saving} className="w-full">{saving ? t('fpm_gerando') : t('fpm_gerar_parcelas')}</Button>
          </div>
        )}

        {installments.length > 0 && (
          <div>
            <h4 className="font-display font-semibold text-sm mb-2">{t('fpm_parcelas_titulo')}</h4>
            <div className="space-y-2">
              {installments.map(inst => (
                <div key={inst.id} className="bg-white border border-slate-100 rounded-xl px-4 py-3">
                  <div className="flex items-center justify-between gap-3 mb-1">
                    <div className="text-sm font-medium text-blueprint">
                      {project.payment_mode === 'parcial' && inst.installment_number === 1
                        ? t('fpm_entrada')
                        : project.payment_mode === 'parcial'
                        ? (installments.length === 2 ? t('fpm_restante') : t('fpm_parcela_do_restante')(inst.installment_number - 1))
                        : installments.length > 1 ? t('fpm_parcela_n')(inst.installment_number) : t('fpm_pagamento_unico')}
                    </div>
                    {editingInstallmentId !== inst.id && (
                      <div className="flex items-center gap-1 flex-shrink-0">
                        <button onClick={() => startEditingInstallment(inst)} className="text-slate-400 hover:text-safety p-1"><Icon path={ICONS.edit} className="w-3.5 h-3.5" /></button>
                        {installments.length > 1 && (
                          <button onClick={() => deleteInstallment(inst)} className="text-slate-400 hover:text-red-500 p-1"><Icon path={ICONS.x} className="w-3.5 h-3.5" /></button>
                        )}
                      </div>
                    )}
                  </div>

                  {editingInstallmentId === inst.id ? (
                    <div className="flex items-center gap-2">
                      <input type="number" step="0.01" value={editInstAmount} onChange={e => setEditInstAmount(e.target.value)}
                        className="w-24 px-2 py-1.5 rounded-lg border border-safety text-sm font-mono text-blueprint focus:outline-none focus:ring-2 focus:ring-safety/30" />
                      <input type="date" value={editInstDate} onChange={e => setEditInstDate(e.target.value)}
                        className="flex-1 px-2 py-1.5 rounded-lg border border-safety text-sm text-blueprint focus:outline-none focus:ring-2 focus:ring-safety/30" />
                      <button onClick={() => saveInstallment(inst)} className="text-emerald-600 hover:text-emerald-700 p-1.5 flex-shrink-0"><Icon path={ICONS.check} className="w-4 h-4" /></button>
                      <button onClick={() => setEditingInstallmentId(null)} className="text-slate-400 hover:text-slate-600 p-1.5 flex-shrink-0"><Icon path={ICONS.x} className="w-4 h-4" /></button>
                    </div>
                  ) : (
                    <div className="flex items-center justify-between gap-3">
                      <div className="text-xs text-slate-400">
                        {inst.status === 'recebido' ? t('fpm_recebido_em')(fmtDate(inst.received_date)) : t('fpm_vencimento')(fmtDate(inst.due_date))}
                      </div>
                      <div className="flex items-center gap-2 flex-shrink-0">
                        <span className="font-mono text-sm text-blueprint">{fmtCurrency(inst.amount)}</span>
                        <select value={inst.status} onChange={e => updateInstallmentStatus(inst, e.target.value)}
                          className={`text-xs font-medium px-2 py-1.5 rounded-lg border focus:outline-none focus:ring-2 focus:ring-safety/30 ${INSTALLMENT_STATUS_COLORS[inst.status]}`}>
                          <option value="a_receber">{t('fin_status_pendente')}</option>
                          <option value="atrasada">{t('fin_status_atrasado')}</option>
                          <option value="recebido">{t('fin_status_recebido')}</option>
                        </select>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
            <div className="text-xs text-slate-500 mt-2 flex items-center justify-between">
              <span>{t('fpm_soma_parcelas')} <span className="font-mono text-blueprint">{fmtCurrency(installments.reduce((s, i) => s + Number(i.amount || 0), 0))}</span></span>
              {Math.abs(installments.reduce((s, i) => s + Number(i.amount || 0), 0) - total) > 0.01 && (
                <span className="text-amber-600">{t('fpm_diferente_total')(fmtCurrency(total))}</span>
              )}
            </div>
            <button onClick={addManualInstallment} className="mt-2 text-xs text-safety font-medium hover:underline flex items-center gap-1">
              <Icon path={ICONS.plus} className="w-3.5 h-3.5" /> {t('fpm_adicionar_parcela_manual')}
            </button>
          </div>
        )}
      </div>
    </Modal>
  );
}


const getServiceTypes = () => ({
  remocao_tarima: t('svc_remocao_tarima'),
  instalacao_tarima: t('svc_instalacao_tarima'),
  montagem_movel: t('svc_montagem_movel'),
  planejado_moveis: t('svc_planejado_moveis'),
  manutencao_montagem: t('svc_manutencao_montagem'),
});
const TARIMA_SERVICES = ['remocao_tarima', 'instalacao_tarima'];

const getPricingMethods = () => [
  { key: 'm2',       label: t('pricing_m2'),      icon: 'ruler',    desc: t('pm_desc_m2') },
  { key: 'unidade',  label: t('pricing_unidade'), icon: 'briefcase', desc: t('pm_desc_unidade') },
  { key: 'empreita', label: t('pricing_empreita'), icon: 'check',    desc: t('pm_desc_empreita') },
  { key: 'diaria',   label: t('pricing_diaria'),  icon: 'chart',    desc: t('pm_desc_diaria') },
  { key: 'hora',     label: t('pricing_hora'),    icon: 'chart',    desc: t('pm_desc_hora') },
  { key: 'valor_livre', label: t('pricing_valor_livre'), icon: 'euro', desc: t('pm_desc_valor_livre') },
];

function emptyService() {
  return {
    id: Math.random().toString(36).slice(2),
    service_type: '', service_name: '', pricing_method: '',
    area_m2: '', price_per_m2: '',
    quantity_units: '', price_per_unit: '',
    fixed_value: '',
    daily_rate: '', num_days: '1',
    hourly_rate: '', num_hours: '',
    descriptions: [{ id: Math.random().toString(36).slice(2), title: '', body: '', files: [] }],
  };
}

function emptyDescription() {
  return { id: Math.random().toString(36).slice(2), title: '', body: '', files: [] };
}

function serviceSubtotal(s) {
  if (s.pricing_method === 'm2') return (parseFloat(s.area_m2) || 0) * (parseFloat(s.price_per_m2) || 0);
  if (s.pricing_method === 'unidade') return (parseInt(s.quantity_units) || 0) * (parseFloat(s.price_per_unit) || 0);
  if (s.pricing_method === 'diaria') return (parseFloat(s.daily_rate) || 0) * (parseInt(s.num_days) || 0);
  if (s.pricing_method === 'hora') return (parseFloat(s.hourly_rate) || 0) * (parseFloat(s.num_hours) || 0);
  return parseFloat(s.fixed_value) || 0;
}

function ServiceBlock({ s, idx, isTarima, onUpdate, onRemove, canRemove, onOpenCalculator, companyServices, companyId }) {
  const [showPricingMenu, setShowPricingMenu] = useState(false);
  const [showServicePicker, setShowServicePicker] = useState(false);
  const [search, setSearch] = useState('');
  const searchRef = useRef(null);
  const PRICING_METHODS = getPricingMethods();
  const selectedMethod = PRICING_METHODS.find(m => m.key === s.pricing_method);
  const sSubtotal = serviceSubtotal(s);
  const descriptions = s.descriptions && s.descriptions.length > 0 ? s.descriptions : [emptyDescription()];

  const updateDescriptions = (next) => onUpdate(s.id, 'descriptions', next);
  const addDescription = () => updateDescriptions([...descriptions, emptyDescription()]);
  const removeDescription = (descId) => updateDescriptions(descriptions.length > 1 ? descriptions.filter(d => d.id !== descId) : descriptions);
  const updateDescriptionField = (descId, field, value) => updateDescriptions(descriptions.map(d => d.id === descId ? { ...d, [field]: value } : d));

  const uploadDescFile = async (descId, file) => {
    const ext = file.name.split('.').pop();
    const path = `${companyId}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const { error } = await db.storage.from('project-files').upload(path, file, { upsert: false });
    if (error) return;
    const { data } = db.storage.from('project-files').getPublicUrl(path);
    const fileObj = { name: file.name, url: data.publicUrl, type: file.type, size: file.size };
    updateDescriptions(descriptions.map(d => d.id === descId ? { ...d, files: [...d.files, fileObj] } : d));
  };
  const removeDescFile = (descId, fileUrl) => updateDescriptions(descriptions.map(d => d.id === descId ? { ...d, files: d.files.filter(f => f.url !== fileUrl) } : d));

  const hasCustom = companyServices && companyServices.length > 0;
  const activeServices = hasCustom ? companyServices.filter(sv => sv.active) : [];
  const filtered = hasCustom
    ? activeServices.filter(sv => sv.name.toLowerCase().includes(search.toLowerCase()))
    : Object.entries(getServiceTypes()).filter(([, label]) => label.toLowerCase().includes(search.toLowerCase())).map(([k, label]) => ({ id: k, name: label }));

  const displayName = s.service_name || getServiceTypes()[s.service_type] || '';

  const selectService = (svc) => {
    onUpdate(s.id, 'service_name', svc.name);
    onUpdate(s.id, 'service_type', hasCustom ? (svc.id || '') : svc.id);
    // método de cobrança sempre escolhido manualmente na obra
    setShowServicePicker(false);
    setSearch('');
  };

  useEffect(() => {
    if (!showServicePicker) return;
    const close = (e) => { if (!e.target.closest('[data-svc-picker]')) { setShowServicePicker(false); setSearch(''); }};
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [showServicePicker]);

  useEffect(() => { if (showServicePicker && searchRef.current) searchRef.current.focus(); }, [showServicePicker]);

  return (
    <div className="bg-slate-50 rounded-xl p-4 space-y-3">
      <div className="flex items-center gap-2">
        {/* Searchable service picker */}
        <div className="relative flex-1" data-svc-picker>
          <button type="button" onClick={() => setShowServicePicker(v => !v)}
            className="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm hover:border-safety/50 transition-colors text-left">
            <span className={displayName ? 'text-blueprint font-medium' : 'text-slate-400'}>
              {displayName || t('sb_selecione_servico')(idx + 1)}
            </span>
            <Icon path={ICONS.chevron} className={`w-4 h-4 text-slate-400 flex-shrink-0 transition-transform ${showServicePicker ? 'rotate-90' : ''}`} />
          </button>
          {showServicePicker && (

                        <div className="w-20 h-20 rounded-lg border border-slate-200 bg-white flex flex-col items-center justify-center p-1">

        </div>
      )}
    </div>
  );
}


// ============================================================
// QUICK SERVICE MODAL — cadastro rápido de serviço a partir do formulário de obra
// ============================================================
function QuickServiceModal({ companyId, onClose, onCreated }) {
  const [name, setName] = useState('');
  const [description, setDescription] = useState('');
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');

  const save = async (e) => {
    e.preventDefault();
    setSaving(true);
    setError('');
    const { data, error: err } = await db.from('company_services')
      .insert({ company_id: companyId, name, description: description || null })
      .select().single();
    setSaving(false);
    if (err) { setError(err.message || t('qs_erro_cadastrar')); return; }
    onCreated(data);
  };

  return (
    <Modal title={t('servicos_cadastrar')} onClose={onClose}>
      <form onSubmit={save} className="space-y-4">
        <Input label={t('servicos_nome_label') + ' *'} required value={name} onChange={e => setName(e.target.value)} placeholder={t('servicos_nome_placeholder')} />
        <TextArea label={t('servicos_descricao_label')} rows="2" value={description} onChange={e => setDescription(e.target.value)} placeholder={t('servicos_descricao_placeholder')} />
        {error && <div className="text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2">{error}</div>}
        <div className="flex gap-2 pt-2">
          <Button type="submit" className="flex-1" disabled={saving}>{saving ? t('servicos_salvando') : t('qs_salvar_usar')}</Button>
          <Button type="button" variant="outline" onClick={onClose}>{t('servicos_cancelar')}</Button>
        </div>
      </form>
    </Modal>
  );
}

// ============================================================
// COMPANY SERVICES PAGE — catálogo de serviços da empresa
// ============================================================
function CompanyServicesPage({ companyId, onChanged }) {
  const [services, setServices] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name: '', description: '', default_pricing_method: '' });
  const [saving, setSaving] = useState(false);

  const load = async () => {
    const { data } = await db.from('company_services').select('*').eq('company_id', companyId).order('name');
    setServices(data || []);
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const openNew = () => { setEditing(null); setForm({ name: '', description: '', default_pricing_method: '' }); setShowForm(true); };
  const openEdit = (svc) => { setEditing(svc); setForm({ name: svc.name, description: svc.description || '', default_pricing_method: svc.default_pricing_method || '' }); setShowForm(true); };

  const save = async (e) => {
    e.preventDefault();
    setSaving(true);
    if (editing) {
      await db.from('company_services').update({ name: form.name, description: form.description, default_pricing_method: form.default_pricing_method || null }).eq('id', editing.id);
    } else {
      await db.from('company_services').insert({ company_id: companyId, name: form.name, description: form.description, default_pricing_method: form.default_pricing_method || null });
    }
    setSaving(false); setShowForm(false); load(); onChanged();
  };

  const toggleActive = async (svc) => { await db.from('company_services').update({ active: !svc.active }).eq('id', svc.id); load(); onChanged(); };
  const remove = async (svc) => {
    if (!confirm(t('servicos_confirmar_excluir')(svc.name))) return;
    await db.from('company_services').delete().eq('id', svc.id); load(); onChanged();
  };

  const pricingLabels = { m2: t('pricing_m2'), unidade: t('pricing_unidade'), empreita: t('pricing_empreita'), diaria: t('pricing_diaria'), hora: t('pricing_hora'), valor_livre: t('pricing_valor_livre') };

  return (
    <>
      <PageHeader title={t('servicos_title')} subtitle={t('servicos_subtitle')}
        action={<Button onClick={openNew}><Icon path={ICONS.plus} className="w-4 h-4"/>{t('servicos_cadastrar')}</Button>} />
      {loading ? <Spinner /> : services.length === 0 ? (
        <EmptyState icon="briefcase" title={t('servicos_vazio_titulo')} subtitle={t('servicos_vazio_subtitulo')} />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {services.map(svc => (
            <div key={svc.id} className={`bg-white rounded-2xl border p-5 shadow-sm ${!svc.active ? 'opacity-50 border-slate-200' : 'border-slate-100'}`}>
              <div className="flex items-start justify-between mb-2">
                <div className="font-display font-semibold text-blueprint">{svc.name}</div>
                {!svc.active && <span className="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">{t('servicos_inativo')}</span>}
              </div>
              {svc.description && <div className="text-xs text-slate-500 mb-2">{svc.description}</div>}
              {svc.default_pricing_method && <div className="text-xs text-safety font-medium mb-3">{pricingLabels[svc.default_pricing_method]}</div>}
              <div className="flex items-center gap-2 pt-1">
                <button onClick={() => openEdit(svc)} className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 text-xs text-blueprint hover:bg-slate-50">
                  <Icon path={ICONS.edit} className="w-3.5 h-3.5"/>{t('common_editar')}
                </button>
                <button onClick={() => toggleActive(svc)} className="px-3 py-2 rounded-xl border border-slate-200 text-xs text-slate-500 hover:bg-slate-50">
                  {svc.active ? t('servicos_desativar') : t('servicos_ativar')}
                </button>
                <button onClick={() => remove(svc)} className="p-2 rounded-xl border border-red-100 text-red-500 hover:bg-red-50">
                  <Icon path={ICONS.trash} className="w-3.5 h-3.5"/>
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
      {showForm && (
        <Modal title={editing ? t('servicos_editar_titulo') : t('servicos_cadastrar')} onClose={() => setShowForm(false)}>
          <form onSubmit={save} className="space-y-4">
            <Input label={t('servicos_nome_label') + ' *'} required value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))} placeholder={t('servicos_nome_placeholder')} />
            <TextArea label={t('servicos_descricao_label')} rows="2" value={form.description} onChange={e => setForm(f => ({...f, description: e.target.value}))} placeholder={t('servicos_descricao_placeholder')} />
            <div className="flex gap-2 pt-2">
              <Button type="submit" className="flex-1" disabled={saving}>{saving ? t('servicos_salvando') : t('servicos_salvar')}</Button>
              <Button type="button" variant="outline" onClick={() => setShowForm(false)}>{t('servicos_cancelar')}</Button>
            </div>
          </form>
        </Modal>
      )}
    </>
  );
}

function ProjectFormModal({ companyId, company, employees, profile, companyServices, onClose, onSaved, editingProject }) {
  const isEdit = !!editingProject;

  const [form, setForm] = useState({
    title: editingProject?.title || '',
    client_name: editingProject?.client_name || '',
    address: editingProject?.address || '',
    work_to_do: editingProject?.work_to_do || '',
    description: editingProject?.description || '',
    budget: editingProject?.budget || '',
    start_date: editingProject?.start_date || '',
    end_date: editingProject?.end_date || '',
  });
  const [services, setServices] = useState([emptyService()]);
  const [taxPassedOn, setTaxPassedOn] = useState(editingProject?.tax_passed_on || false);
  const [showTeamSelect, setShowTeamSelect] = useState(false);
  const [selectedTeam, setSelectedTeam] = useState({});
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const [calculatorServiceId, setCalculatorServiceId] = useState(null);
  const [localCompanyServices, setLocalCompanyServices] = useState(companyServices || []);
  const [showQuickService, setShowQuickService] = useState(false);

  // Load existing services (com descrições), team quando editando
  useEffect(() => {
    if (!isEdit) return;

    // Load services + suas descrições
    db.from('project_services').select('*').eq('project_id', editingProject.id).then(async ({ data }) => {
      if (data && data.length > 0) {
        const serviceIds = data.map(s => s.id);
        const { data: descData } = await db.from('project_descriptions').select('*').in('project_service_id', serviceIds).order('sort_order');
        setServices(data.map(s => ({
          id: s.id,
          service_type: s.service_type || '',
          service_name: s.service_name || s.service_type || '',
          pricing_method: s.pricing_method || '',
          area_m2: s.area_m2 || '',
          price_per_m2: s.price_per_m2 || '',
          quantity_units: s.quantity_units || '',
          price_per_unit: s.price_per_unit || '',
          fixed_value: s.fixed_value || s.subtotal || '',
          daily_rate: s.daily_rate || '',
          num_days: s.num_days || '1',
          hourly_rate: s.hourly_rate || '',
          num_hours: s.num_hours || '',
          descriptions: (descData || []).filter(d => d.project_service_id === s.id).map(d => ({
            id: d.id,
            title: d.title || '',
            body: d.body || '',
            files: typeof d.files === 'string' ? JSON.parse(d.files) : (d.files || []),
          })),
        })));
      }
    });

    // Load team
    db.from('project_team')
      .select('*, employees(full_name, employment_type, salary)')
      .eq('project_id', editingProject.id)
      .then(({ data }) => {
        if (data && data.length > 0) {
          const team = {};
          data.forEach(t => {
            if (t.is_self) {
              team['self'] = { payment_type: 'self', payment_value: 0 };
            } else if (t.employee_id) {
              team[t.employee_id] = {
                payment_type: t.payment_type,
                payment_value: t.payment_value || '',
                daily_rate: t.daily_rate || '',
                num_days: t.num_days || '1',
              };
            }
          });
          setSelectedTeam(team);
          setShowTeamSelect(Object.keys(team).length > 0);
        }
      });
  }, []);

  const onOpenCalculator = (serviceId) => setCalculatorServiceId(serviceId);
  const onCalculatorDone = (serviceId, area) => {
    updateService(serviceId, 'area_m2', area.toFixed(2));
    setCalculatorServiceId(null);
  };

  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  const updateService = (id, field, value) => {
    setServices(prev => prev.map(s => {
      if (s.id !== id) return s;
      const next = { ...s, [field]: value };
      if (field === 'service_type') {
        next.pricing_method = ''; // reset method on service change
      }
      return next;
    }));
  };

  const addService = () => setServices(prev => [...prev, emptyService()]);
  const removeService = (id) => setServices(prev => prev.length > 1 ? prev.filter(s => s.id !== id) : prev);

  const totalFromServices = services.reduce((sum, s) => sum + serviceSubtotal(s), 0);
  const anyServiceSelected = services.some(s => s.service_type);
  const serviceValue = anyServiceSelected ? totalFromServices : (parseFloat(form.budget) || 0);
  const hasTaxRate = company?.tax_rate != null && company.tax_rate !== '';
  const taxRateValue = hasTaxRate ? parseFloat(company.tax_rate) : 0;
  const taxRateFraction = taxRateValue / 100;
  // Modo "empresa absorve": informativo apenas — total cobrado continua sendo o valor do serviço,
  // o imposto é só uma estimativa do quanto sai desse valor.
  const absorbTaxAmount = hasTaxRate ? serviceValue * taxRateFraction : 0;
  const absorbNetValue = serviceValue - absorbTaxAmount;
  // Modo "repassar ao cliente": o valor do serviço precisa sobrar intacto pra empresa, então o
  // imposto é calculado "por dentro" (gross-up) — dividindo em vez de somar direto.
  const passOnGrandTotal = hasTaxRate && taxRateFraction < 1 ? serviceValue / (1 - taxRateFraction) : serviceValue;
  const passOnTaxAmount = passOnGrandTotal - serviceValue;

  const taxAmount = taxPassedOn ? passOnTaxAmount : 0;
  const grandTotal = taxPassedOn ? passOnGrandTotal : serviceValue;

  const toggleEmployee = (key, emp) => {
    setSelectedTeam(prev => {
      const next = { ...prev };
      if (next[key]) {
        delete next[key];
      } else if (key === 'self') {
        next.self = { payment_type: 'self', payment_value: 0 };
      } else if (emp.employment_type === 'registered') {
        next[key] = { payment_type: 'salario', payment_value: emp.salary || 0 };
      } else {
        next[key] = { payment_type: 'diaria', daily_rate: '', num_days: '1', payment_value: '' };
      }
      return next;
    });
  };

  const updateFreelanceValue = (key, field, value) => {
    setSelectedTeam(prev => {
      const row = { ...prev[key], [field]: value };
      if (row.payment_type === 'diaria') {
        const dr = parseFloat(field === 'daily_rate' ? value : row.daily_rate) || 0;
        const nd = parseInt(field === 'num_days' ? value : row.num_days) || 0;
        row.payment_value = dr * nd;
      }
      return { ...prev, [key]: row };
    });
  };

  const changePaymentType = (key, newType) => {
    setSelectedTeam(prev => {
      const row = { ...prev[key], payment_type: newType };
      if (newType === 'diaria') {
        row.daily_rate = row.daily_rate || '';
        row.num_days = row.num_days || '1';
        row.payment_value = (parseFloat(row.daily_rate) || 0) * (parseInt(row.num_days) || 0);
      } else {
        row.payment_value = '';
      }
      return { ...prev, [key]: row };
    });
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSaving(true);
    setError('');

    const finalBudget = anyServiceSelected ? grandTotal : (form.budget ? grandTotal : null);
    const usedServices = services.filter(s => s.service_type || s.service_name);

    const projectData = {
      title: form.title,
      client_name: form.client_name || null,
      address: form.address || null,
      work_to_do: form.work_to_do || null,
      description: form.description || null,
      budget: finalBudget,
      amount_to_receive: finalBudget,
      tax_passed_on: hasTaxRate ? taxPassedOn : false,
      tax_rate_snapshot: hasTaxRate ? taxRateValue : null,
      tax_amount: hasTaxRate ? (taxPassedOn ? taxAmount : absorbTaxAmount) : null,
      start_date: form.start_date || null,
      end_date: form.end_date || null,
      service_type: usedServices.length === 1 ? (usedServices[0].service_type || usedServices[0].service_name) : null,
      pricing_method: usedServices.length === 1 ? usedServices[0].pricing_method : null,
      length_m: null,
      width_m: null,
      area_m2: usedServices.length === 1 && usedServices[0].pricing_method === 'm2' ? (parseFloat(usedServices[0].area_m2) || null) : null,
      price_per_m2: usedServices.length === 1 && usedServices[0].pricing_method === 'm2' ? (parseFloat(usedServices[0].price_per_m2) || null) : null,
      quantity_units: usedServices.length === 1 && usedServices[0].pricing_method === 'unidade' ? (parseInt(usedServices[0].quantity_units) || null) : null,
      price_per_unit: usedServices.length === 1 && usedServices[0].pricing_method === 'unidade' ? (parseFloat(usedServices[0].price_per_unit) || null) : null,
    };

    let project;
    if (isEdit) {
      // UPDATE existing project
      const { data, error: projError } = await db.from('projects').update(projectData).eq('id', editingProject.id).select().single();
      if (projError) { setError(projError.message); setSaving(false); return; }
      project = data;
      // Delete and re-insert services
      await db.from('project_services').delete().eq('project_id', editingProject.id);
      // Delete and re-insert descriptions
      await db.from('project_descriptions').delete().eq('project_id', editingProject.id);
    } else {
      // INSERT new project
      const { data, error: projError } = await db.from('projects').insert({ company_id: companyId, ...projectData, status: 'a_iniciar' }).select().single();
      if (projError) { setError(projError.message); setSaving(false); return; }
      project = data;
    }

    if (usedServices.length > 0) {
      const serviceRows = usedServices.map(s => ({
        project_id: project.id,
        company_id: companyId,
        service_type: s.service_type,
        pricing_method: s.pricing_method,
        length_m: null,
        width_m: null,
        area_m2: s.pricing_method === 'm2' ? (parseFloat(s.area_m2) || null) : null,
        price_per_m2: s.pricing_method === 'm2' ? (parseFloat(s.price_per_m2) || null) : null,
        quantity_units: s.pricing_method === 'unidade' ? (parseInt(s.quantity_units) || null) : null,
        price_per_unit: s.pricing_method === 'unidade' ? (parseFloat(s.price_per_unit) || null) : null,
        fixed_value: ['empreita','valor_livre'].includes(s.pricing_method) ? (parseFloat(s.fixed_value) || null) : null,
        subtotal: serviceSubtotal(s),
      }));
      const { data: insertedServices, error: servError } = await db.from('project_services').insert(serviceRows).select();
      if (servError) { setError(servError.message); setSaving(false); return; }

      // Salva as descrições de cada serviço, vinculadas ao id do serviço recém-criado
      const descRows = [];
      insertedServices.forEach((row, i) => {
        const originalDescs = usedServices[i].descriptions || [];
        originalDescs.filter(d => d.title || d.body || d.files.length > 0).forEach((d, j) => {
          descRows.push({
            project_id: project.id,
            project_service_id: row.id,
            company_id: companyId,
            title: d.title,
            body: d.body,
            files: JSON.stringify(d.files),
            sort_order: j,
          });
        });
      });
      if (descRows.length > 0) {
        await db.from('project_descriptions').insert(descRows);
      }
    }

    const teamRows = Object.entries(selectedTeam).map(([key, info]) => ({
      project_id: project.id,
      employee_id: key === 'self' ? null : key,
      admin_profile_id: key === 'self' ? profile.id : null,
      is_self: key === 'self',
      company_id: companyId,
      payment_type: info.payment_type,
      payment_value: info.payment_value ? parseFloat(info.payment_value) : 0,
      daily_rate: info.payment_type === 'diaria' && info.daily_rate ? parseFloat(info.daily_rate) : null,
      num_days: info.payment_type === 'diaria' && info.num_days ? parseInt(info.num_days) : null,
      payment_status: 'pendente',
    }));

    if (isEdit) {
      // In edit mode: update payment values for existing team rows
      for (const [key, info] of Object.entries(selectedTeam)) {
        if (key === 'self') continue; // self row has no payment value to update
        const newPaymentValue = info.payment_value ? parseFloat(info.payment_value) : 0;
        const newDailyRate = info.payment_type === 'diaria' && info.daily_rate ? parseFloat(info.daily_rate) : null;
        const newNumDays = info.payment_type === 'diaria' && info.num_days ? parseInt(info.num_days) : null;
        await db.from('project_team')
          .update({
            payment_type: info.payment_type,
            payment_value: newPaymentValue,
            daily_rate: newDailyRate,
            num_days: newNumDays,
          })
          .eq('project_id', project.id)
          .eq('employee_id', key);
      }
    } else if (teamRows.length > 0) {
      const { error: teamError } = await db.from('project_team').insert(teamRows);
      if (teamError) { setError(teamError.message); setSaving(false); return; }
    }

    onSaved();
  };

  const selectedCount = Object.keys(selectedTeam).length;
  const paymentTypeLabels = { empreita: 'Empreita', diaria: 'Diária', hora: 'Por hora', salario: 'Salário', self: 'Você mesmo' };

  return (
    <Modal title={isEdit ? t('pf_title_editar') : t('pf_title_nova')} onClose={onClose} wide>
      <form onSubmit={handleSubmit} className="space-y-4">
        <Input label={t('pf_nome_obra')} required value={form.title} onChange={set('title')} placeholder={t('pf_nome_obra_ph')} />
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <Input label={t('pf_cliente')} value={form.client_name} onChange={set('client_name')} placeholder={t('pf_cliente')} />
          <Input label={t('pf_endereco')} value={form.address} onChange={set('address')} placeholder={t('pf_endereco')} />
        </div>
        <div className="space-y-3">
          <div className="flex items-center justify-between">
            <span className="block text-xs font-medium text-slate-500">{t('pf_tipos_servico')}</span>
            <div className="flex items-center gap-3">
              <button type="button" onClick={() => setShowQuickService(true)} className="text-xs text-safety font-medium hover:underline flex items-center gap-1">
                <Icon path={ICONS.plus} className="w-3.5 h-3.5" /> {t('pf_cadastrar_novo_servico')}
              </button>
              <button type="button" onClick={addService} className="text-xs text-safety font-medium hover:underline flex items-center gap-1">
                <Icon path={ICONS.plus} className="w-3.5 h-3.5" /> {t('pf_adicionar_servico')}
              </button>
            </div>
          </div>

          {services.map((s, idx) => (
            <ServiceBlock
              key={s.id}
              s={s}
              idx={idx}
              isTarima={TARIMA_SERVICES.includes(s.service_type)}
              onUpdate={updateService}
              onRemove={removeService}
              canRemove={services.length > 1}
              onOpenCalculator={onOpenCalculator}
              companyServices={localCompanyServices}
              companyId={companyId}
            />
          ))}

          {anyServiceSelected && (
            <div className="flex items-center justify-between text-sm bg-blueprint/5 rounded-xl px-4 py-3 border border-blueprint/10">
              <span className="font-medium text-blueprint">{t('pf_total_servicos')}</span>
              <span className="font-mono font-semibold text-blueprint text-base">{fmtCurrency(totalFromServices)}</span>
            </div>
          )}

          {hasTaxRate && (
            <div className="bg-amber-50/60 border border-amber-100 rounded-xl p-4 space-y-3">
              <label className="flex items-center justify-between cursor-pointer gap-3">
                <div>
                  <div className="text-sm font-medium text-blueprint">{t('pf_repassar_imposto')}</div>
                  <div className="text-xs text-slate-500 mt-0.5">
                    {t('pf_aliquota_configurada')(taxRateValue)} {taxPassedOn
                      ? t('pf_repasse_ligado_texto')
                      : t('pf_repasse_desligado_texto')}
                  </div>
                </div>
                <input type="checkbox" checked={taxPassedOn} onChange={e => setTaxPassedOn(e.target.checked)}
                  className="w-5 h-5 rounded accent-safety flex-shrink-0" />
              </label>
              {serviceValue > 0 && (
                <div className="border-t border-amber-100 pt-3 space-y-1.5 text-sm">
                  <div className="flex justify-between text-slate-600">
                    <span>{t('pf_valor_servico')}</span>
                    <span className="font-mono">{fmtCurrency(serviceValue)}</span>
                  </div>
                  {taxPassedOn ? (
                    <>
                      <div className="flex justify-between text-slate-600">
                        <span>{t('pf_imposto_sobre_servico')}</span>
                        <span className="font-mono">{fmtCurrency(passOnTaxAmount)}</span>
                      </div>
                      <div className="flex justify-between font-semibold text-blueprint pt-1.5 border-t border-amber-100">
                        <span>{t('pf_total_cobrado_cliente')}</span>
                        <span className="font-mono">{fmtCurrency(passOnGrandTotal)}</span>
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="flex justify-between text-slate-600">
                        <span>{t('pf_valor_imposto_pct')(taxRateValue)}</span>
                        <span className="font-mono">{fmtCurrency(absorbTaxAmount)}</span>
                      </div>
                      <div className="flex justify-between font-semibold text-blueprint pt-1.5 border-t border-amber-100">
                        <span>{t('pf_total_liquido_estimado')}</span>
                        <span className="font-mono">{fmtCurrency(absorbNetValue)}</span>
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>
          )}
        </div>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <Input label={`${t('pf_valor_orcamento')} (${currentCurrencySymbol()})`} type="number" step="0.01" required={!anyServiceSelected}
            value={anyServiceSelected ? totalFromServices.toFixed(2) : form.budget}
            onChange={set('budget')} disabled={anyServiceSelected} placeholder="0,00" />
          <Input label={t('pf_data_inicio')} type="date" value={form.start_date} onChange={set('start_date')} />
          <Input label={t('pf_data_entrega')} type="date" value={form.end_date} onChange={set('end_date')} />
        </div>

        <div className="border-t border-slate-100 pt-4">
          <button type="button" onClick={() => setShowTeamSelect(s => !s)} className="flex items-center justify-between w-full text-left">
            <div>
              <div className="font-display font-semibold text-blueprint">{t('pf_selecionar_equipe')}</div>
              <div className="text-xs text-slate-400">{selectedCount > 0 ? t('pf_selecionados')(selectedCount) : t('pf_escolha_quem')}</div>
            </div>
            <Icon path={ICONS.chevron} className={`w-5 h-5 text-slate-400 transition-transform ${showTeamSelect ? 'rotate-90' : ''}`} />
          </button>

          {showTeamSelect && (
            <div className="mt-3 space-y-2 max-h-72 overflow-y-auto pr-1">
              {(() => {
                const selfSelected = !!selectedTeam.self;
                return (
                  <div className={`rounded-xl border p-3 transition-colors ${selfSelected ? 'border-safety bg-safety/5' : 'border-slate-200'}`}>
                    <div className="flex items-center justify-between cursor-pointer" onClick={() => toggleEmployee('self')}>
                      <div className="flex items-center gap-3">
                        <div className={`w-5 h-5 rounded-md border flex items-center justify-center flex-shrink-0 ${selfSelected ? 'bg-safety border-safety text-white' : 'border-slate-300'}`}>
                          {selfSelected && <Icon path={ICONS.check} className="w-3.5 h-3.5" />}
                        </div>
                        <div>
                          <div className="text-sm font-medium text-blueprint">{t('pf_eu_mesmo')}</div>
                          <div className="text-xs text-slate-400">{t('pf_vincular_voce')}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })()}

              {employees.length === 0 ? (
                <div className="text-sm text-slate-400 px-1 pt-1">{t('pf_nenhum_colaborador_ainda')}</div>
              ) : employees.map(emp => {
                const selected = !!selectedTeam[emp.id];
                const row = selectedTeam[emp.id];
                return (
                  <div key={emp.id} className={`rounded-xl border p-3 transition-colors ${selected ? 'border-safety bg-safety/5' : 'border-slate-200'}`}>
                    <div className="flex items-center justify-between cursor-pointer" onClick={() => toggleEmployee(emp.id, emp)}>
                      <div className="flex items-center gap-3">
                        <div className={`w-5 h-5 rounded-md border flex items-center justify-center flex-shrink-0 ${selected ? 'bg-safety border-safety text-white' : 'border-slate-300'}`}>
                          {selected && <Icon path={ICONS.check} className="w-3.5 h-3.5" />}
                        </div>
                        <div>
                          <div className="text-sm font-medium text-blueprint">{emp.full_name}</div>
                          <div className="text-xs text-slate-400">{emp.employment_type === 'registered' ? t('pf_registrado_mes')(fmtCurrency(emp.salary)) : t('equipe_freelance')}</div>
                        </div>
                      </div>
                    </div>
                    {selected && emp.employment_type === 'freelance' && (
                      <div className="mt-3 pl-8 space-y-2">
                        <Select value={row.payment_type} onChange={e => changePaymentType(emp.id, e.target.value)}>
                          <option value="empreita">{t('pricing_empreita')}</option>
                          <option value="diaria">{t('pricing_diaria')}</option>
                          <option value="hora">{t('pricing_hora')}</option>
                        </Select>
                        {row.payment_type === 'diaria' ? (
                          <>
                            <div className="grid grid-cols-2 gap-2">
                              <Input type="number" step="0.01" placeholder={`${t('pf_valor_diaria')} (${currentCurrencySymbol()})`} required value={row.daily_rate} onChange={e => updateFreelanceValue(emp.id, 'daily_rate', e.target.value)} />
                              <Input type="number" min="1" placeholder={t('pf_num_dias')} required value={row.num_days} onChange={e => updateFreelanceValue(emp.id, 'num_days', e.target.value)} />
                            </div>
                            <div className="text-xs text-slate-500 flex items-center justify-between bg-white rounded-lg px-2.5 py-1.5 border border-slate-100">
                              <span>{t('pf_total_dias')(row.num_days || 0, parseInt(row.num_days) === 1 ? t('pd_dia') : t('pd_dias'))}</span>
                              <span className="font-mono font-semibold text-blueprint">{fmtCurrency(row.payment_value)}</span>
                            </div>
                          </>
                        ) : (
                          <Input type="number" step="0.01" placeholder={`${t('pf_valor')} (${currentCurrencySymbol()})`} required value={row.payment_value} onChange={e => updateFreelanceValue(emp.id, 'payment_value', e.target.value)} />
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {error && <div className="text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2">{error}</div>}
        <div className="flex gap-2 pt-2">
          <Button type="submit" className="flex-1" disabled={saving}>{saving ? t('pf_salvando') : isEdit ? t('pf_salvar_alteracoes') : t('obras_cadastrar')}</Button>
          <Button type="button" variant="outline" onClick={onClose}>{t('nf_cancelar')}</Button>
        </div>
      </form>

      {calculatorServiceId && (
        <MeasurementCalculator
          onClose={() => setCalculatorServiceId(null)}
          onApply={(area) => onCalculatorDone(calculatorServiceId, area)}
        />
      )}

      {showQuickService && (
        <QuickServiceModal
          companyId={companyId}
          onClose={() => setShowQuickService(false)}
          onCreated={(newSvc) => {
            setLocalCompanyServices(prev => [...prev, newSvc]);
            setShowQuickService(false);
          }}
        />
      )}
    </Modal>
  );
}
