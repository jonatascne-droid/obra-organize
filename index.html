// ============================================================
// MEASUREMENT CALCULATOR — planta baixa 2D interativa
// ============================================================
// w.x/w.y é o CENTRO da parede (é assim que o desenho e o teste de clique já funcionam).
// As pontas real (início/fim) ficam a meio comprimento de distância, na direção do ângulo.
function wallEndpoints(w) {
  const a = (w.angle || 0) * Math.PI / 180;
  const halfDx = Math.cos(a) * (w.length || 0) / 2;
  const halfDy = Math.sin(a) * (w.length || 0) / 2;
  return {
    start: [w.x - halfDx, w.y - halfDy],
    end: [w.x + halfDx, w.y + halfDy],
  };
}

// Detecta cômodos: encontra cada "face mínima" do desenho, ou seja, cada área fechada
// delimitada por paredes — mesmo quando duas salas COMPARTILHAM uma parede no meio
// (a técnica antiga marcava a parede como "já usada" pelo primeiro cômodo e não deixava
// o segundo reaproveitá-la, o que está errado: uma parede interna pertence aos dois lados).
// Funciona seguindo, a partir de cada ponta de cada parede, sempre o próximo segmento que
// faz o menor giro possível — assim o contorno sempre fecha pela menor área possível
// tocando aquela parede, que é exatamente um cômodo.
// Retorna [{ wallIndices: [...], points: [[x,y], ...] }].
function findRooms(walls) {
  const THRESH = 0.12; // tolerância um pouco maior, pra absorver pequenas imprecisões de arraste
  const eps = walls.map(w => wallEndpoints(w));
  const n = walls.length;
  if (n < 3) return [];

  const angleOf = (from, to) => Math.atan2(to[1] - from[1], to[0] - from[0]);

  const traceFace = (startIdx, fromStart) => {
    let atPoint = fromStart ? eps[startIdx].start : eps[startIdx].end;
    let prevPoint = fromStart ? eps[startIdx].end : eps[startIdx].start;
    const path = [startIdx];
    const points = [prevPoint];
    let safety = n * 2 + 6;
    while (safety-- > 0) {
      points.push(atPoint);
      if (points.length > 3 && Math.hypot(atPoint[0] - points[0][0], atPoint[1] - points[0][1]) < THRESH) {
        points.pop();
        return { wallIndices: path, points };
      }
      const incomingAngle = angleOf(atPoint, prevPoint);
      let best = null, bestDiff = Infinity;
      for (let j = 0; j < n; j++) {
        const sp = eps[j].start, ep = eps[j].end;
        let outPt = null;
        if (Math.hypot(atPoint[0] - sp[0], atPoint[1] - sp[1]) < THRESH) outPt = ep;
        else if (Math.hypot(atPoint[0] - ep[0], atPoint[1] - ep[1]) < THRESH) outPt = sp;
        if (outPt === null) continue;
        // Evita voltar imediatamente pela mesma parede que acabou de ser percorrida
        if (Math.hypot(outPt[0] - prevPoint[0], outPt[1] - prevPoint[1]) < THRESH) continue;
        const outAngle = angleOf(atPoint, outPt);
        let diff = incomingAngle - outAngle;
        while (diff <= 0) diff += 2 * Math.PI;
        while (diff > 2 * Math.PI) diff -= 2 * Math.PI;
        if (diff < bestDiff) { bestDiff = diff; best = { idx: j, point: outPt }; }
      }
      if (!best) return null;
      path.push(best.idx);
      prevPoint = atPoint;
      atPoint = best.point;
    }
    return null;
  };

  const rooms = [];
  const seen = new Set();
  for (let i = 0; i < n; i++) {
    for (const fromStart of [true, false]) {
      const face = traceFace(i, fromStart);
      if (!face) continue;
      const sig = [...face.wallIndices].sort((a, b) => a - b).join(',');
      if (seen.has(sig)) continue;
      seen.add(sig);
      rooms.push(face);
    }
  }
  return rooms;
}

function pointInPolygon(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];
    const intersect = ((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function polygonArea(points) {
  let area = 0;
  for (let i = 0; i < points.length; i++) {
    const j = (i + 1) % points.length;
    area += points[i][0] * points[j][1];
    area -= points[j][0] * points[i][1];
  }
  return Math.abs(area) / 2;
}

function MeasurementCalculator({ onClose, onApply, companyId, measurementId, savedName, savedWalls, savedRooms }) {
  const canvasRef = useRef(null);
  const stateRef = useRef({
    walls: savedWalls || [],
    selected: null,
    zoom: 60,          // pixels per meter
    panX: 40,
    panY: 40,
    dragging: null,    // { type:'wall'|'pan', idx?, startX, startY, origX, origY, panX, panY }
    draggingEndpoint: null, // { idx, which:'start'|'end', fixedPoint }
    rooms: [],         // cache dos cômodos detectados no último draw()
    hoverRoomIdx: null,
    selectedRoomIdx: null,
  });
  const [walls, setWalls] = useState(savedWalls || []);
  const [selected, setSelected] = useState(null);
  const [selectedRoomIdx, setSelectedRoomIdx] = useState(null);
  const [roomSaveName, setRoomSaveName] = useState('');
  const [savedRoomsList, setSavedRoomsList] = useState(savedRooms || []);
  const [wallEditLength, setWallEditLength] = useState('');
  const [wallEditName, setWallEditName] = useState('');
  const [wallEditAngle, setWallEditAngle] = useState('');
  const [showAddWall, setShowAddWall] = useState(false);
  const [newWall, setNewWall] = useState({ name: '', length: '', angle: '0', height: '', thick: '0.15' });
  const [saveName, setSaveName] = useState(savedName || '');
  const [saving, setSaving] = useState(false);
  const [results, setResults] = useState(null);
  const [zoom, setZoom] = useState(60);
  const animRef = useRef(null);

  const DPR = window.devicePixelRatio || 2;

  // ---- draw ----
  const draw = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const s = stateRef.current;
    const W = canvas.width / DPR;
    const H = canvas.height / DPR;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.scale(DPR, DPR);
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#F8F9FA';
    ctx.fillRect(0, 0, W, H);

    // Grid
    const gridSize = s.zoom;
    const offX = s.panX % gridSize;
    const offY = s.panY % gridSize;
    ctx.strokeStyle = '#E2E8F0';
    ctx.lineWidth = 1;
    for (let x = offX; x < W; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = offY; y < H; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // Major grid every 5m
    ctx.strokeStyle = '#CBD5E1';
    ctx.lineWidth = 1;
    const major = gridSize * 5;
    const mOffX = s.panX % major;
    const mOffY = s.panY % major;
    for (let x = mOffX; x < W; x += major) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = mOffY; y < H; y += major) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // Scale label
    ctx.fillStyle = '#94A3B8';
    ctx.font = '11px Inter';
    ctx.fillText(`1m = ${s.zoom}px  |  zoom: ${Math.round(s.zoom * 100 / 60)}%`, 10, H - 10);

    // Cômodos detectados: preenche cada um (cinza claro / cinza mais escuro no hover / laranja clarinho se selecionado)
    const rooms = findRooms(s.walls);
    s.rooms = rooms;
    // Desenha do maior pro menor, pra um cômodo pequeno nunca ficar "tampado" por um contorno maior (ex: a casa toda)
    const drawOrder = rooms.map((room, ri) => ({ room, ri })).sort((a, b) => polygonArea(b.room.points) - polygonArea(a.room.points));
    drawOrder.forEach(({ room, ri }) => {
      ctx.beginPath();
      room.points.forEach(([px, py], i) => {
        const sx = s.panX + px * s.zoom;
        const sy = s.panY + py * s.zoom;
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      });
      ctx.closePath();
      if (s.selectedRoomIdx === ri) ctx.fillStyle = 'rgba(242,100,26,0.20)';
      else if (s.hoverRoomIdx === ri) ctx.fillStyle = '#CBD5E1';
      else ctx.fillStyle = '#E7EBF0';
      ctx.fill();
      if (s.selectedRoomIdx === ri) { ctx.strokeStyle = '#F2641A'; ctx.lineWidth = 2; ctx.stroke(); }
    });

    // Draw walls
    s.walls.forEach((w, i) => {
      const isSel = s.selected === i;
      const len = Math.max(w.length || 1, 0.1) * s.zoom;
      const thick = Math.max(w.thick || 0.15, 0.05) * s.zoom;
      const cx = s.panX + w.x * s.zoom;
      const cy = s.panY + w.y * s.zoom;
      const angle = (w.angle || 0) * Math.PI / 180;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      // Shadow for selected
      if (isSel) {
        ctx.shadowColor = '#F2641A';
        ctx.shadowBlur = 8;
      }

      // Wall body
      const grad = ctx.createLinearGradient(-len/2, -thick/2, -len/2, thick/2);
      grad.addColorStop(0, isSel ? '#FF8A4D' : '#2F4259');
      grad.addColorStop(1, isSel ? '#F2641A' : '#1E2B3C');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(-len/2, -thick/2, len, thick, Math.min(3, thick/3));
      ctx.fill();
      ctx.shadowBlur = 0;

      // Border
      ctx.strokeStyle = isSel ? '#C9500F' : '#141E2A';
      ctx.lineWidth = isSel ? 2 : 1;
      ctx.stroke();

      // Length label
      if (len > 30) {
        ctx.fillStyle = 'white';
        ctx.font = `bold ${Math.min(12, Math.max(9, thick * 0.55))}px Inter`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${w.length}m`, 0, 0);
      }

      // Angle hint
      if (isSel) {
        ctx.fillStyle = 'rgba(30,43,60,0.7)';
        ctx.beginPath();
        ctx.roundRect(len/2 + 6, -10, 44, 18, 3);
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = '10px Inter';
        ctx.textAlign = 'left';
        ctx.fillText(`${Math.round(w.angle || 0)}°`, len/2 + 10, 0);
      }

      ctx.restore();

      // Endpoint handles (arraste a ponta pra angular/redimensionar mantendo a outra ponta fixa)
      if (isSel) {
        const { start, end } = wallEndpoints(w);
        [start, end].forEach(([px, py]) => {
          const sx = s.panX + px * s.zoom;
          const sy = s.panY + py * s.zoom;
          ctx.fillStyle = '#F2641A';
          ctx.beginPath();
          ctx.arc(sx, sy, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'white';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });
      }
    });

    ctx.restore();
  };

  useEffect(() => { stateRef.current.walls = walls; draw(); }, [walls, selected, selectedRoomIdx, zoom]);

  // Calcula automaticamente assim que um cômodo é selecionado (ou limpa quando desseleciona)
  useEffect(() => {
    if (selectedRoomIdx !== null) {
      calculateResults(selectedRoomIdx);
    } else {
      setResults(null);
    }
  }, [selectedRoomIdx, walls]);

  // Preenche os campos de edição de nome/comprimento/ângulo sempre que a parede selecionada mudar
  useEffect(() => {
    if (selected !== null && walls[selected]) {
      setWallEditName(walls[selected].name || '');
      setWallEditLength(String(walls[selected].length ?? ''));
      setWallEditAngle(String(Math.round(walls[selected].angle || 0)));
    }
  }, [selected]);

  // ---- hit test (rotated rect) ----
  const hitTest = (wx, wy) => {
    const s = stateRef.current;
    for (let i = s.walls.length - 1; i >= 0; i--) {
      const w = s.walls[i];
      const len = Math.max(w.length || 1, 0.1);
      const thick = Math.max(w.thick || 0.15, 0.05);
      const angle = (w.angle || 0) * Math.PI / 180;
      const dx = wx - w.x;
      const dy = wy - w.y;
      const lx = dx * Math.cos(-angle) - dy * Math.sin(-angle);
      const ly = dx * Math.sin(-angle) + dy * Math.cos(-angle);
      if (Math.abs(lx) < len/2 + 0.1 && Math.abs(ly) < thick/2 + 0.1) return i;
    }
    return null;
  };

  // Testa se o clique foi numa das duas pontas da parede selecionada (pra arrastar e reangular)
  const hitTestEndpoint = (mx, my) => {
    const s = stateRef.current;
    if (s.selected === null) return null;
    const w = s.walls[s.selected];
    const { start, end } = wallEndpoints(w);
    const sx = s.panX + start[0] * s.zoom, sy = s.panY + start[1] * s.zoom;
    const ex = s.panX + end[0] * s.zoom, ey = s.panY + end[1] * s.zoom;
    if (Math.hypot(mx - sx, my - sy) < 10) return 'start';
    if (Math.hypot(mx - ex, my - ey) < 10) return 'end';
    return null;
  };

  const getCanvasPos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return [(e.clientX - rect.left), (e.clientY - rect.top)];
  };

  const canvasToWorld = (cx, cy) => {
    const s = stateRef.current;
    return [(cx - s.panX) / s.zoom, (cy - s.panY) / s.zoom];
  };

  const onMouseDown = (e) => {
    const [mx, my] = getCanvasPos(e);
    const s = stateRef.current;

    // 1) Arrastar uma ponta da parede selecionada?
    const ep = hitTestEndpoint(mx, my);
    if (ep) {
      const w = s.walls[s.selected];
      const { start, end } = wallEndpoints(w);
      s.draggingEndpoint = { idx: s.selected, which: ep, fixedPoint: ep === 'start' ? end : start };
      return;
    }

    // 2) Clicou em cima de uma parede (selecionar + arrastar ela toda)?
    const [wx, wy] = canvasToWorld(mx, my);
    const hit = hitTest(wx, wy);
    if (hit !== null) {
      s.selected = hit;
      setSelected(hit);
      s.selectedRoomIdx = null;
      setSelectedRoomIdx(null);
      s.dragging = { type: 'wall', idx: hit, startX: mx, startY: my, origX: s.walls[hit].x, origY: s.walls[hit].y };
      draw();
      return;
    }

    // 3) Clicou dentro de um cômodo fechado (seleciona o MENOR cômodo que contém o ponto,
    // já que o contorno externo também pode ser detectado como uma "face" válida)
    let roomHit = null;
    let roomHitArea = Infinity;
    (s.rooms || []).forEach((room, ri) => {
      if (pointInPolygon([wx, wy], room.points)) {
        const a = polygonArea(room.points);
        if (a < roomHitArea) { roomHitArea = a; roomHit = ri; }
      }
    });
    if (roomHit !== null) {
      s.selected = null;
      setSelected(null);
      s.selectedRoomIdx = roomHit;
      setSelectedRoomIdx(roomHit);
      setRoomSaveName('');
      draw();
      return;
    }

    // 4) Área em branco: desseleciona tudo e começa a mover a câmera (pan)
    s.selected = null;
    setSelected(null);
    s.selectedRoomIdx = null;
    setSelectedRoomIdx(null);
    s.dragging = { type: 'pan', startX: mx, startY: my, origPanX: s.panX, origPanY: s.panY };
  };

  const onMouseMove = (e) => {
    const [mx, my] = getCanvasPos(e);
    const s = stateRef.current;

    // Arrastando uma ponta: recalcula ângulo e comprimento mantendo a outra ponta fixa
    if (s.draggingEndpoint) {
      const { idx, which, fixedPoint } = s.draggingEndpoint;
      let [wx, wy] = canvasToWorld(mx, my);

      // Ancoragem também aqui: gruda na ponta de outra parede se estiver perto
      const snapThreshold = 16 / s.zoom;
      let bestDist = snapThreshold;
      let snapPt = null;
      s.walls.forEach((w, i) => {
        if (i === idx) return;
        const { start, end } = wallEndpoints(w);
        [start, end].forEach(([px, py]) => {
          const d = Math.hypot(wx - px, wy - py);
          if (d < bestDist) { bestDist = d; snapPt = [px, py]; }
        });
      });
      if (snapPt) { wx = snapPt[0]; wy = snapPt[1]; }

      const newLength = Math.max(Math.hypot(wx - fixedPoint[0], wy - fixedPoint[1]), 0.05);
      const angleRad = which === 'end'
        ? Math.atan2(wy - fixedPoint[1], wx - fixedPoint[0])
        : Math.atan2(fixedPoint[1] - wy, fixedPoint[0] - wx);
      const newAngle = angleRad * 180 / Math.PI;
      const newCx = (fixedPoint[0] + wx) / 2;
      const newCy = (fixedPoint[1] + wy) / 2;

      s.walls = s.walls.map((w, i) => i === idx ? { ...w, x: newCx, y: newCy, angle: newAngle, length: newLength } : w);
      setWalls([...s.walls]);
      draw();
      return;
    }

    // Parado (sem arrastar nada): detecta hover sobre cômodos fechados (o menor que contém o ponto)
    if (!s.dragging) {
      const [wx, wy] = canvasToWorld(mx, my);
      let hoverIdx = null;
      let hoverArea = Infinity;
      (s.rooms || []).forEach((room, ri) => {
        if (pointInPolygon([wx, wy], room.points)) {
          const a = polygonArea(room.points);
          if (a < hoverArea) { hoverArea = a; hoverIdx = ri; }
        }
      });
      if (s.hoverRoomIdx !== hoverIdx) { s.hoverRoomIdx = hoverIdx; draw(); }
      return;
    }

    if (s.dragging.type === 'wall') {
      const dx = (mx - s.dragging.startX) / s.zoom;
      const dy = (my - s.dragging.startY) / s.zoom;
      let newX = s.dragging.origX + dx;
      let newY = s.dragging.origY + dy;

      // Ancoragem: gruda a PONTA (início ou fim) da parede arrastada na ponta de outra parede,
      // deslocando o centro pra que essa ponta encaixe exatamente (efeito ímã).
      const draggedWall = s.walls[s.dragging.idx];
      const da = (draggedWall.angle || 0) * Math.PI / 180;
      const halfDx = Math.cos(da) * (draggedWall.length || 0) / 2;
      const halfDy = Math.sin(da) * (draggedWall.length || 0) / 2;
      const candidateEndpoints = [
        [newX - halfDx, newY - halfDy], // ponta inicial prevista
        [newX + halfDx, newY + halfDy], // ponta final prevista
      ];

      const otherPoints = [];
      s.walls.forEach((w, i) => {
        if (i === s.dragging.idx) return;
        const { start, end } = wallEndpoints(w);
        otherPoints.push(start, end);
      });

      const snapThreshold = 16 / s.zoom;
      let bestDist = snapThreshold;
      let bestDelta = null;
      candidateEndpoints.forEach(([cex, cey]) => {
        otherPoints.forEach(([px, py]) => {
          const d = Math.hypot(cex - px, cey - py);
          if (d < bestDist) { bestDist = d; bestDelta = [px - cex, py - cey]; }
        });
      });
      if (bestDelta) { newX += bestDelta[0]; newY += bestDelta[1]; }

      s.walls = s.walls.map((w, i) => i === s.dragging.idx ? { ...w, x: newX, y: newY } : w);
      setWalls([...s.walls]);
    } else {
      s.panX = s.dragging.origPanX + (mx - s.dragging.startX);
      s.panY = s.dragging.origPanY + (my - s.dragging.startY);
    }
    draw();
  };

  const onMouseUp = () => {
    const s = stateRef.current;
    s.dragging = null;
    s.draggingEndpoint = null;
  };

  const onWheel = (e) => {
    e.preventDefault();
    const s = stateRef.current;
    const [mx, my] = getCanvasPos(e);
    const factor = e.deltaY < 0 ? 1.1 : 0.91;
    const newZoom = Math.min(300, Math.max(15, s.zoom * factor));
    s.panX = mx - (mx - s.panX) * (newZoom / s.zoom);
    s.panY = my - (my - s.panY) * (newZoom / s.zoom);
    s.zoom = newZoom;
    setZoom(newZoom);
    draw();
  };

  const addWall = () => {
    if (!newWall.length) return;
    const s = stateRef.current;
    const anchorIdx = s.selected !== null ? s.selected : (s.walls.length > 0 ? s.walls.length - 1 : null);
    const newLen = parseFloat(newWall.length);
    const newAngle = parseFloat(newWall.angle) || 0;
    const a = newAngle * Math.PI / 180;
    let cx, cy;
    if (anchorIdx !== null) {
      // Ancora a PONTA INICIAL desta parede nova exatamente na ponta final da parede anterior.
      // Como x/y guarda o CENTRO da parede, precisamos deslocar meio comprimento na direção do ângulo.
      const [anchorEndX, anchorEndY] = wallEndpoints(s.walls[anchorIdx]).end;
      cx = anchorEndX + Math.cos(a) * newLen / 2;
      cy = anchorEndY + Math.sin(a) * newLen / 2;
    } else {
      cx = (canvasRef.current.clientWidth / 2 - s.panX) / s.zoom;
      cy = (canvasRef.current.clientHeight / 2 - s.panY) / s.zoom;
    }
    const w = {
      name: newWall.name?.trim() || null,
      length: newLen,
      angle: newAngle,
      height: parseFloat(newWall.height) || 0,
      thick: parseFloat(newWall.thick) || 0.15,
      x: cx, y: cy,
    };
    const updated = [...s.walls, w];
    s.walls = updated;
    s.selected = updated.length - 1;
    setWalls(updated);
    setSelected(updated.length - 1);
    setNewWall({ name: '', length: '', angle: '0', height: '', thick: '0.15' });
    setShowAddWall(false);
  };

  const deleteSelected = () => {
    const s = stateRef.current;
    if (s.selected === null) return;
    const updated = s.walls.filter((_, i) => i !== s.selected);
    s.walls = updated;
    s.selected = null;
    setWalls(updated);
    setSelected(null);
  };

  const rotateSelected90 = () => {
    const s = stateRef.current;
    if (s.selected === null) return;
    const updated = s.walls.map((w, i) => i === s.selected ? { ...w, angle: ((w.angle || 0) + 90) % 360 } : w);
    s.walls = updated;
    setWalls(updated);
  };

  // Edita comprimento/ângulo por número, mantendo a PONTA INICIAL da parede fixa no lugar
  // (mesma lógica de quando se arrasta a ponta com o mouse).
  const updateSelectedWallDims = (field, value) => {
    const s = stateRef.current;
    if (s.selected === null) return;
    const w = s.walls[s.selected];
    const { start } = wallEndpoints(w);
    const parsed = parseFloat(value);
    if (isNaN(parsed)) return;
    const newLength = field === 'length' ? Math.max(parsed, 0.05) : (w.length || 0);
    const newAngle = field === 'angle' ? parsed : (w.angle || 0);
    const a = newAngle * Math.PI / 180;
    const end = [start[0] + Math.cos(a) * newLength, start[1] + Math.sin(a) * newLength];
    const newCx = (start[0] + end[0]) / 2;
    const newCy = (start[1] + end[1]) / 2;
    const updated = s.walls.map((ww, i) => i === s.selected ? { ...ww, x: newCx, y: newCy, angle: newAngle, length: newLength } : ww);
    s.walls = updated;
    setWalls(updated);
  };

  const renameSelectedWall = (value) => {
    const s = stateRef.current;
    if (s.selected === null) return;
    const updated = s.walls.map((ww, i) => i === s.selected ? { ...ww, name: value.trim() || null } : ww);
    s.walls = updated;
    setWalls(updated);
  };

  const calculateResults = (roomIdx) => {
    const s = stateRef.current;
    const room = s.rooms?.[roomIdx];
    if (!room) return;
    const roomWalls = room.wallIndices.map(i => s.walls[i]);
    const perimeter = roomWalls.reduce((sum, w) => sum + (w.length || 0), 0);
    const wallsArea = roomWalls.reduce((sum, w) => sum + (w.length || 0) * (w.height || 0), 0);
    const area = polygonArea(room.points);
    setResults({
      areaM2: Math.round(area * 100) / 100,
      perimeter: Math.round(perimeter * 100) / 100,
      wallsArea: Math.round(wallsArea * 100) / 100,
    });
  };

  const handleSave = async () => {
    const s = stateRef.current;
    if (!saveName || !companyId) return;
    setSaving(true);
    // "Metragem geral": soma os cômodos salvos, se houver algum; senão usa o resultado do cômodo
    // selecionado no momento (projeto simples, sem subdivisão em cômodos nomeados).
    const generalArea = savedRoomsList.length > 0
      ? Math.round(savedRoomsList.reduce((sum, r) => sum + (r.area_m2 || 0), 0) * 100) / 100
      : (results?.areaM2 ?? null);
    const generalPerimeter = savedRoomsList.length > 0
      ? Math.round(savedRoomsList.reduce((sum, r) => sum + (r.perimeter_m || 0), 0) * 100) / 100
      : (results?.perimeter ?? null);
    const generalWallsArea = savedRoomsList.length > 0
      ? Math.round(savedRoomsList.reduce((sum, r) => sum + (r.walls_area_m2 || 0), 0) * 100) / 100
      : (results?.wallsArea ?? null);
    await db.from('measurements').upsert({
      ...(measurementId ? { id: measurementId } : {}),
      company_id: companyId,
      name: saveName,
      walls: JSON.stringify(s.walls),
      rooms: JSON.stringify(savedRoomsList),
      area_m2: generalArea,
      perimeter_m: generalPerimeter,
      walls_area_m2: generalWallsArea,
      updated_at: new Date().toISOString(),
    });
    setSaving(false);
  };

  // Salva o cômodo dentro da LISTA LOCAL deste projeto (não cria outro projeto separado).
  // Só vira registro persistido de verdade quando o botão "Salvar metragem" for usado.
  const saveRoom = () => {
    const s = stateRef.current;
    if (!roomSaveName || selectedRoomIdx === null) return;
    const room = s.rooms[selectedRoomIdx];
    if (!room) return;
    const roomWalls = room.wallIndices.map(i => s.walls[i]);
    const area = polygonArea(room.points);
    const perimeter = roomWalls.reduce((sum, w) => sum + (w.length || 0), 0);
    const wallsArea = roomWalls.reduce((sum, w) => sum + (w.length || 0) * (w.height || 0), 0);
    const entry = {
      name: roomSaveName,
      area_m2: Math.round(area * 100) / 100,
      perimeter_m: Math.round(perimeter * 100) / 100,
      walls_area_m2: Math.round(wallsArea * 100) / 100,
      wallIndices: room.wallIndices,
    };
    setSavedRoomsList(prev => {
      const existingIdx = prev.findIndex(r => r.name === roomSaveName);
      if (existingIdx >= 0) {
        const copy = [...prev];
        copy[existingIdx] = entry;
        return copy;
      }
      return [...prev, entry];
    });
    setRoomSaveName('');
    setSelectedRoomIdx(null);
    s.selectedRoomIdx = null;
    draw();
  };

  // Reabre a seleção de um cômodo já salvo, a partir do card na lista
  const selectSavedRoom = (entry) => {
    const s = stateRef.current;
    const rooms = s.rooms || [];
    const matchIdx = rooms.findIndex(r =>
      r.wallIndices.length === entry.wallIndices.length &&
      r.wallIndices.every(i => entry.wallIndices.includes(i))
    );
    if (matchIdx === -1) {
      alert('Não foi possível localizar esse cômodo no desenho atual — pode ter sido alterado. Selecione-o de novo clicando na área.');
      return;
    }
    s.selected = null;
    setSelected(null);
    s.selectedRoomIdx = matchIdx;
    setSelectedRoomIdx(matchIdx);
    setRoomSaveName(entry.name);
    draw();
  };

  const deleteSavedRoom = (name) => {
    setSavedRoomsList(prev => prev.filter(r => r.name !== name));
  };

  // Set up canvas DPR on mount
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const resize = () => {
      const W = canvas.clientWidth;
      const H = canvas.clientHeight;
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      draw();
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(canvas);
    return () => ro.disconnect();
  }, []);

  const selWall = selected !== null ? walls[selected] : null;

  return (
    <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[60] fade-in p-4">
      <div className="bg-white rounded-2xl shadow-2xl flex flex-col scale-in"
        style={{ width: '96vw', maxWidth: 1100, height: '90vh' }}>

        {/* Header */}
        <div className="flex items-center justify-between px-5 py-3 border-b border-slate-100 flex-shrink-0">
          <div className="flex items-center gap-2">
            <Icon path={ICONS.ruler} className="w-5 h-5 text-safety" />
            <span className="font-display font-semibold text-lg">{t('mc_title')}</span>
            <span className="text-xs text-slate-400 ml-2">{walls.length} {walls.length === 1 ? t('mc_parede') : t('mc_paredes')}</span>
            {(() => {
              const detected = findRooms(walls);
              // Ignora, na contagem, qualquer "cômodo" que só existe porque engloba outros por dentro
              // (o contorno da casa inteira, por exemplo) — só conta os menores de verdade.
              const leafRooms = detected.filter(r =>
                !detected.some(other => other !== r && other.points.every(p => pointInPolygon(p, r.points)))
              );
              if (leafRooms.length === 0) return null;
              return (
                <span className="text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-full px-2 py-0.5 ml-1 flex items-center gap-1">
                  <Icon path={ICONS.check} className="w-3 h-3" /> {leafRooms.length === 1 ? t('mc_ambiente_fechado') : t('mc_ambientes_fechados')(leafRooms.length)}
                </span>
              );
            })()}
          </div>
          <div className="flex items-center gap-2">
            <span className="text-xs text-slate-400">{t('mc_hint')}</span>
            <button onClick={onClose} className="text-slate-400 hover:text-blueprint p-1.5 rounded-lg hover:bg-slate-100 ml-2">
              <Icon path={ICONS.x} className="w-5 h-5" />
            </button>
          </div>
        </div>

        <div className="flex flex-1 overflow-hidden">
          {/* Canvas */}
          <div className="flex-1 relative overflow-hidden bg-slate-50 cursor-crosshair select-none">
            <canvas ref={canvasRef}
              style={{ width: '100%', height: '100%', display: 'block', cursor: 'crosshair' }}
              onMouseDown={onMouseDown}
              onMouseMove={onMouseMove}
              onMouseUp={onMouseUp}
              onMouseLeave={onMouseUp}
              onWheel={onWheel}
            />
            {walls.length === 0 && (
              <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <div className="text-4xl mb-3" style={{fontSize:"2rem"}}>m²</div>
                <div className="text-slate-500 font-medium">{t('mc_vazio_titulo')}</div>
                <div className="text-slate-400 text-sm mt-1">{t('mc_vazio_subtitulo')}</div>
              </div>
            )}
            {/* Zoom controls */}
            <div className="absolute bottom-4 right-4 flex items-center gap-1 bg-white rounded-xl border border-slate-200 shadow-sm p-1">
              <button onClick={() => { const s = stateRef.current; s.zoom = Math.min(300, s.zoom * 1.2); setZoom(s.zoom); draw(); }}
                className="w-7 h-7 rounded-lg flex items-center justify-center text-blueprint hover:bg-slate-100 text-lg font-bold">+</button>
              <span className="text-xs text-slate-500 w-12 text-center font-mono">{Math.round(zoom * 100 / 60)}%</span>
              <button onClick={() => { const s = stateRef.current; s.zoom = Math.max(15, s.zoom * 0.83); setZoom(s.zoom); draw(); }}
                className="w-7 h-7 rounded-lg flex items-center justify-center text-blueprint hover:bg-slate-100 text-lg font-bold">−</button>
              <button onClick={() => { const s = stateRef.current; s.zoom = 60; s.panX = 40; s.panY = 40; setZoom(60); draw(); }}
                className="w-7 h-7 rounded-lg flex items-center justify-center text-blueprint hover:bg-slate-100 text-xs">⌂</button>
            </div>
          </div>

          {/* Right panel */}
          <div className="w-full md:w-64 border-t md:border-t-0 md:border-l border-slate-100 flex flex-col bg-white overflow-y-auto max-h-48 md:max-h-none">

            {/* Add wall */}
            <div className="p-4 border-b border-slate-100">
              {!showAddWall ? (
                <Button onClick={() => {
                  const s = stateRef.current;
                  const anchorIdx = s.selected !== null ? s.selected : (s.walls.length > 0 ? s.walls.length - 1 : null);
                  const suggestedAngle = anchorIdx !== null ? Math.round((((s.walls[anchorIdx].angle || 0) + 90) % 360)) : 0;
                  setNewWall(w => ({ ...w, angle: String(suggestedAngle) }));
                  setShowAddWall(true);
                }} className="w-full">
                  <Icon path={ICONS.plus} className="w-4 h-4" />{t('mc_criar_parede')}
                </Button>
              ) : (
                <div className="space-y-2">
                  <div className="font-display font-semibold text-sm mb-2">{t('mc_nova_parede')}</div>
                  <Input label={t('mc_nome_parede')} placeholder={t('mc_nome_parede_ph')} value={newWall.name} onChange={e => setNewWall(p => ({...p, name: e.target.value}))} />
                  <Input label={t('mc_comprimento')} type="number" step="0.01" placeholder="ex: 3.5" value={newWall.length} onChange={e => setNewWall(p => ({...p, length: e.target.value}))} />
                  <Input label={t('mc_angulo')} type="number" step="1" placeholder="0" value={newWall.angle} onChange={e => setNewWall(p => ({...p, angle: e.target.value}))} />
                  <Input label={t('mc_altura')} type="number" step="0.01" placeholder="ex: 2.8" value={newWall.height} onChange={e => setNewWall(p => ({...p, height: e.target.value}))} />
                  <Input label={t('mc_espessura')} type="number" step="0.01" placeholder="0.15" value={newWall.thick} onChange={e => setNewWall(p => ({...p, thick: e.target.value}))} />
                  <div className="flex gap-2 pt-1">
                    <Button onClick={addWall} className="flex-1">{t('mc_adicionar')}</Button>
                    <Button variant="outline" onClick={() => setShowAddWall(false)}>{t('mc_cancelar')}</Button>
                  </div>
                </div>
              )}
            </div>

            {/* Selected wall */}
            {selWall && (
              <div className="p-4 border-b border-slate-100">
                <div className="flex items-center justify-between mb-3">
                  <div className="font-display font-semibold text-sm">{selWall.name || t('mc_parede_n')(selected + 1)}</div>
                  <button onClick={deleteSelected} className="p-1.5 rounded-lg border border-red-100 text-red-500 hover:bg-red-50">
                    <Icon path={ICONS.trash} className="w-3.5 h-3.5" />
                  </button>
                </div>
                <Input label={t('mc_nome_parede')} placeholder={`${t('mc_prefixo_parede')}${selected + 1}`} value={wallEditName}
                  onChange={e => { setWallEditName(e.target.value); renameSelectedWall(e.target.value); }} />
                <div className="grid grid-cols-2 gap-2 text-xs mb-3 mt-2">
                  <div className="bg-slate-50 rounded-lg p-2">
                    <div className="text-slate-400 mb-1">{t('mc_comprimento_curto')}</div>
                    <input type="number" step="0.01" value={wallEditLength}
                      onChange={e => { setWallEditLength(e.target.value); updateSelectedWallDims('length', e.target.value); }}
                      className="w-full bg-transparent font-mono font-semibold text-blueprint focus:outline-none" />
                  </div>
                  <div className="bg-slate-50 rounded-lg p-2">
                    <div className="text-slate-400 mb-1">{t('mc_angulo_curto')}</div>
                    <input type="number" step="1" value={wallEditAngle}
                      onChange={e => { setWallEditAngle(e.target.value); updateSelectedWallDims('angle', e.target.value); }}
                      className="w-full bg-transparent font-mono font-semibold text-blueprint focus:outline-none" />
                  </div>
                  {selWall.height > 0 && (
                    <div className="bg-slate-50 rounded-lg p-2">
                      <div className="text-slate-400">{t('mc_altura_curto')}</div>
                      <div className="font-mono font-semibold text-blueprint">{selWall.height} m</div>
                    </div>
                  )}
                </div>
                <div className="space-y-2">
                  <button onClick={rotateSelected90}
                    className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl border border-slate-200 text-sm text-blueprint hover:bg-slate-50">
                    <Icon path={ICONS.rotate} className="w-4 h-4" /> {t('mc_girar90')}
                  </button>
                  <div className="text-xs text-slate-400 text-center">{t('mc_ou_edite')}</div>
                </div>
              </div>
            )}

            {/* Cômodo selecionado */}
            {selectedRoomIdx !== null && (
              <div className="p-4 border-b border-slate-100 bg-safety/5">
                <div className="flex items-center justify-between mb-2">
                  <div className="text-xs font-medium text-safety">{t('mc_comodo_selecionado')}</div>
                  <button onClick={() => { stateRef.current.selectedRoomIdx = null; setSelectedRoomIdx(null); draw(); }} className="text-slate-400 hover:text-blueprint">
                    <Icon path={ICONS.x} className="w-3.5 h-3.5" />
                  </button>
                </div>
                {(() => {
                  const room = stateRef.current.rooms?.[selectedRoomIdx];
                  if (!room) return null;
                  return <div className="text-xs text-slate-500 mb-3">{t('mc_n_paredes')(room.wallIndices.length)}</div>;
                })()}

                {results && (
                  <div className="space-y-1.5 mb-3">
                    <div className="flex justify-between text-xs py-1 border-b border-slate-100">
                      <span className="text-slate-500">{t('mc_area_piso')}</span>
                      <span className="font-mono font-semibold text-blueprint">{results.areaM2} m²</span>
                    </div>
                    <div className="flex justify-between text-xs py-1 border-b border-slate-100">
                      <span className="text-slate-500">{t('mc_perimetro_total')}</span>
                      <span className="font-mono font-semibold text-blueprint">{results.perimeter} m</span>
                    </div>
                    <div className="flex justify-between text-xs py-1">
                      <span className="text-slate-500">{t('mc_area_paredes')}</span>
                      <span className="font-mono font-semibold text-blueprint">{results.wallsArea} m²</span>
                    </div>
                    {onApply && (
                      <Button onClick={() => onApply(results.areaM2)} className="w-full mt-2">
                        {t('mc_usar_m2')(results.areaM2)}
                      </Button>
                    )}
                  </div>
                )}

                <Input placeholder={t('mc_nome_comodo_ph')} value={roomSaveName} onChange={e => setRoomSaveName(e.target.value)} />
                <Button onClick={saveRoom} disabled={!roomSaveName} className="w-full mt-2">
                  <Icon path={ICONS.save} className="w-4 h-4" />{t('mc_salvar_comodo')}
                </Button>
              </div>
            )}

            {/* Cômodos salvos neste projeto */}
            {savedRoomsList.length > 0 && (
              <div className="p-4 border-b border-slate-100">
                <div className="text-xs font-medium text-slate-500 mb-2">{t('mc_comodos_projeto')}</div>
                <div className="space-y-1.5">
                  {savedRoomsList.map(r => (
                    <div key={r.name} onClick={() => selectSavedRoom(r)}
                      className="w-full flex items-center justify-between px-2.5 py-2 rounded-lg text-xs cursor-pointer hover:bg-slate-50 border border-slate-100">
                      <div className="text-left">
                        <div className="font-medium text-blueprint">{r.name}</div>
                        <div className="text-slate-400">{r.area_m2} m² · {t('mc_perimetro_curto')(r.perimeter_m)}</div>
                      </div>
                      <button onClick={e => { e.stopPropagation(); deleteSavedRoom(r.name); }} className="text-slate-300 hover:text-red-500 p-1 flex-shrink-0">
                        <Icon path={ICONS.x} className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  ))}
                </div>

                <div className="mt-3 bg-blueprint/5 border border-blueprint/10 rounded-lg px-2.5 py-2">
                  <div className="text-xs font-semibold text-blueprint mb-1">{t('mc_metragem_geral')}</div>
                  <div className="flex justify-between text-xs">
                    <span className="text-slate-500">{t('mc_area_total')}</span>
                    <span className="font-mono font-semibold text-blueprint">
                      {Math.round(savedRoomsList.reduce((s, r) => s + (r.area_m2 || 0), 0) * 100) / 100} m²
                    </span>
                  </div>
                  <div className="flex justify-between text-xs">
                    <span className="text-slate-500">{t('mc_perimetro_total')}</span>
                    <span className="font-mono font-semibold text-blueprint">
                      {Math.round(savedRoomsList.reduce((s, r) => s + (r.perimeter_m || 0), 0) * 100) / 100} m
                    </span>
                  </div>
                </div>
              </div>
            )}

            {/* Walls list */}
            {walls.length > 0 && (
              <div className="p-4 border-b border-slate-100">
                <div className="text-xs font-medium text-slate-500 mb-2">{t('mc_todas_paredes')}</div>
                <div className="space-y-1 max-h-40 overflow-y-auto">
                  {walls.map((w, i) => (
                    <button key={i} onClick={() => { stateRef.current.selected = i; setSelected(i); draw(); }}
                      className={`w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs text-left transition-colors ${selected === i ? 'bg-safety/10 text-safety font-medium' : 'hover:bg-slate-50 text-slate-600'}`}>
                      <span>{w.name || `${t('mc_prefixo_parede')}${i+1}`} — {w.length}m</span>
                      <span className="text-slate-400">{Math.round(w.angle || 0)}°</span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Save */}
            {companyId && (
              <div className="p-4">
                <div className="text-xs font-medium text-slate-500 mb-1">{t('mc_salvar_projeto')}</div>
                <p className="text-xs text-slate-400 mb-2">{t('mc_salvar_projeto_texto')}</p>
                <Input placeholder={t('mc_nome_projeto_ph')} value={saveName} onChange={e => setSaveName(e.target.value)} />
                <Button variant="outline" onClick={handleSave} disabled={!saveName || saving} className="w-full mt-2">
                  <Icon path={ICONS.save} className="w-4 h-4" />{saving ? t('servicos_salvando') : t('mc_salvar_metragem')}
                </Button>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MEASUREMENTS PAGE — lista de metragens salvas
// ============================================================
function MeasurementsPage({ companyId }) {
  const [measurements, setMeasurements] = useState([]);
  const [loading, setLoading] = useState(true);
  const [viewing, setViewing] = useState(null);
  const [showCalculator, setShowCalculator] = useState(false);

  const load = async () => {
    const { data } = await db.from('measurements').select('*').eq('company_id', companyId).order('updated_at', { ascending: false });
    setMeasurements(data || []);
    setLoading(false);
  };

  useEffect(() => { load(); }, [companyId]);

  const deleteMeasurement = async (id) => {
    if (!confirm(t('metr_confirmar_excluir'))) return;
    await db.from('measurements').delete().eq('id', id);
    load();
  };

  if (loading) return <Spinner />;

  return (
    <>
      <PageHeader title={t('metr_title')} subtitle={t('metr_subtitle')}
        action={<Button onClick={() => setShowCalculator(true)}><Icon path={ICONS.ruler} className="w-4 h-4"/>{t('metr_nova')}</Button>} />

      {measurements.length === 0 ? (
        <EmptyState icon="ruler" title={t('metr_vazio_titulo')} subtitle={t('metr_vazio_subtitulo')} />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {measurements.map(m => (
            <div key={m.id} className="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm hover:shadow-md transition-shadow cursor-pointer" onClick={() => setViewing(m)}>
              <div className="flex items-start justify-between mb-3">
                <div>
                  <div className="font-display font-semibold text-blueprint">{m.name}</div>
                  <div className="text-xs text-slate-400 mt-0.5">{new Date(m.updated_at).toLocaleDateString(t('sal_locale'))}</div>
                </div>
                <div className="w-9 h-9 bg-safety/10 rounded-xl flex items-center justify-center text-safety flex-shrink-0">
                  <Icon path={ICONS.ruler} className="w-4 h-4" />
                </div>
              </div>
              <div className="space-y-1">
                {m.area_m2 != null && <div className="flex justify-between text-sm"><span className="text-slate-500">{t('metr_area_piso')}</span><span className="font-mono text-blueprint">{m.area_m2} m²</span></div>}
                {m.perimeter_m != null && <div className="flex justify-between text-sm"><span className="text-slate-500">{t('metr_perimetro')}</span><span className="font-mono text-blueprint">{m.perimeter_m} m</span></div>}
                {m.walls_area_m2 != null && <div className="flex justify-between text-sm"><span className="text-slate-500">{t('metr_area_paredes')}</span><span className="font-mono text-blueprint">{m.walls_area_m2} m²</span></div>}
                {(() => {
                  const roomsArr = typeof m.rooms === 'string' ? JSON.parse(m.rooms || '[]') : (m.rooms || []);
                  if (roomsArr.length === 0) return null;
                  return <div className="text-xs text-slate-400 pt-1">{roomsArr.length} {roomsArr.length === 1 ? t('metr_comodo') : t('metr_comodos')}: {roomsArr.map(r => r.name).join(', ')}</div>;
                })()}
              </div>
              <div className="flex gap-2 mt-4">
                <button onClick={e => { e.stopPropagation(); setViewing(m); }} className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 text-xs text-blueprint hover:bg-slate-50">
                  <Icon path={ICONS.edit} className="w-3.5 h-3.5"/>{t('metr_abrir')}
                </button>
                <button onClick={e => { e.stopPropagation(); deleteMeasurement(m.id); }} className="p-2 rounded-xl border border-red-100 text-red-500 hover:bg-red-50">
                  <Icon path={ICONS.trash} className="w-4 h-4" />
                </button>
              </div>
            </div>
          ))}
        </div>
      )}

      {showCalculator && (
        <MeasurementCalculator
          companyId={companyId}
          onClose={() => { setShowCalculator(false); load(); }}
          onApply={null}
        />
      )}

      {viewing && (
        <MeasurementCalculator
          companyId={companyId}
          measurementId={viewing.id}
          savedName={viewing.name}
          savedWalls={typeof viewing.walls === 'string' ? JSON.parse(viewing.walls) : viewing.walls}
          savedRooms={typeof viewing.rooms === 'string' ? JSON.parse(viewing.rooms) : (viewing.rooms || [])}
          onClose={() => { setViewing(null); load(); }}
          onApply={null}
        />
      )}
    </>
  );
}

// NOTAS FISCAIS — integração com o Emite Fácil
// ============================================================
const EMITE_FACIL_API_URL = 'https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/criar-pedido-externo';
const EMITE_FACIL_CHECKOUT_URL = 'https://emitefacil.digitproduc.com/';

function generateApiKey() {
  return crypto.randomUUID() + crypto.randomUUID();
}

function NotasFiscaisPage({ company, companyId, onCompanyUpdated }) {
  const [generating, setGenerating] = useState(false);
  const [copied, setCopied] = useState(false);
  const [confirmingRegen, setConfirmingRegen] = useState(false);

  const apiKey = company?.emite_facil_api_key || null;

  const generateKey = async () => {
    setGenerating(true);
    const newKey = generateApiKey();
    await db.from('companies').update({ emite_facil_api_key: newKey }).eq('id', companyId);
    setGenerating(false);
    setConfirmingRegen(false);
    onCompanyUpdated();
  };

  const copyKey = () => {
    if (!apiKey) return;
    navigator.clipboard.writeText(apiKey);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  return (
    <>
      <PageHeader title={t('nf_title')} subtitle={t('nf_subtitle')} />

      {company?.country === 'US' ? (
        <div className="bg-white rounded-2xl border border-slate-100 p-8 shadow-sm max-w-2xl">
          <div className="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center mb-4">
            <Icon path={ICONS.receipt} className="w-6 h-6 text-slate-400" />
          </div>
          <h2 className="font-display font-semibold text-xl text-blueprint mb-2">{t('nf_indisponivel_titulo')}</h2>
          <p className="text-sm text-slate-500">
            {t('nf_indisponivel_texto')}
          </p>
        </div>
      ) : !apiKey ? (
        <div className="bg-white rounded-2xl border border-slate-100 p-8 shadow-sm max-w-2xl">
          <div className="w-12 h-12 rounded-xl bg-safety/10 flex items-center justify-center mb-4">
            <Icon path={ICONS.receipt} className="w-6 h-6 text-safety" />
          </div>
          <h2 className="font-display font-semibold text-xl text-blueprint mb-2">{t('nf_ativar_titulo')}</h2>
          <p className="text-sm text-slate-500 mb-2">
            {t('nf_ativar_texto1')}
          </p>
          <p className="text-sm text-slate-500 mb-6">
            {t('nf_ativar_texto2')}
          </p>
          <div className="flex flex-col sm:flex-row gap-3">
            <a href={EMITE_FACIL_CHECKOUT_URL} target="_blank" rel="noopener noreferrer">
              <Button className="w-full sm:w-auto">
                <Icon path={ICONS.zap} className="w-4 h-4" />{t('nf_ativar_botao')}
              </Button>
            </a>
            <Button variant="outline" onClick={generateKey} disabled={generating}>
              <Icon path={ICONS.receipt} className="w-4 h-4" />
              {generating ? t('nf_gerando') : t('nf_ja_assinei')}
            </Button>
          </div>
        </div>
      ) : (
        <div className="space-y-6 max-w-2xl">
          <div className="bg-white rounded-2xl border border-slate-100 p-6 shadow-sm">
            <div className="flex items-center gap-2 mb-1">
              <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
              <h2 className="font-display font-semibold text-blueprint">{t('nf_sua_chave')}</h2>
            </div>
            <p className="text-sm text-slate-500 mb-4">{t('nf_cole_chave')}</p>
            <div className="flex items-center gap-2">

function ProjectNotes({ project, profile }) {
  const [notes, setNotes] = useState([]);
  const [message, setMessage] = useState('');
  const [loading, setLoading] = useState(true);
  const [sending, setSending] = useState(false);

  const load = async () => {
    const { data } = await db.from('project_notes').select('*').eq('project_id', project.id).order('created_at', { ascending: true });
    setNotes(data || []);
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const send = async (e) => {
    e.preventDefault();
    if (!message.trim()) return;
    setSending(true);

    const { data: note } = await db.from('project_notes').insert({
      project_id: project.id,
      company_id: project.company_id,
      author_id: profile.id,
      author_name: profile.full_name,
      author_role: profile.role,
      message: message.trim(),
    }).select().single();

    // Enviar notificações para os destinatários corretos
    if (note) {
      const preview = message.trim().length > 60 ? message.trim().slice(0, 60) + '...' : message.trim();

      const sendNotif = (recipientId) => db.rpc('send_note_notification', {
        p_company_id: project.company_id,
        p_project_id: project.id,
        p_note_id: note.id,
        p_recipient_profile_id: recipientId,
        p_author_name: profile.full_name,
        p_project_title: project.title,
        p_message_preview: preview,
      });

      if (profile.role === 'employee') {
        // Colaborador escreveu → notifica o admin da empresa
        const { data: adminProfile } = await db.from('profiles')
          .select('id').eq('company_id', project.company_id).eq('role', 'admin').single();
        if (adminProfile) await sendNotif(adminProfile.id);
      } else if (profile.role === 'admin') {
        // Admin escreveu → notifica todos os colaboradores alocados na obra
        const { data: teamRows } = await db.from('project_team')
          .select('employees(profile_id)')
          .eq('project_id', project.id)
          .eq('is_self', false);
        if (teamRows?.length > 0) {
          for (const t of teamRows.filter(t => t.employees?.profile_id)) {
            await sendNotif(t.employees.profile_id);
          }
        }
      }
    }

    setMessage('');
    await load();
    setSending(false);
  };

  const roleLabels = { admin: t('pn_role_empresa'), employee: t('pn_role_equipe'), programmer: t('pn_role_sistema') };

  return (
    <div>
      <h4 className="font-display font-semibold text-sm mb-2">{t('pn_notas_compartilhadas')}</h4>
      <div className="bg-slate-50 rounded-xl p-3 max-h-56 overflow-y-auto space-y-2 mb-2">
        {loading ? <Spinner /> : notes.length === 0 ? (
          <div className="text-sm text-slate-400 text-center py-4">{t('pn_vazio')}</div>
        ) : notes.map(n => (
          <div key={n.id} className="rounded-xl px-3 py-2 text-sm bg-white border border-slate-100">
            <div className="flex items-center gap-2 text-xs text-slate-400 mb-0.5">
              <span className="font-medium text-blueprint">{n.author_name}</span>
              <span>· {roleLabels[n.author_role] || n.author_role}</span>
              <span>· {new Date(n.created_at).toLocaleString(t('sal_locale'), { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</span>
            </div>
            <div className="text-blueprint">{n.message}</div>
          </div>
        ))}
      </div>
      <form onSubmit={send} className="flex gap-2">
        <input value={message} onChange={e => setMessage(e.target.value)} placeholder={t('pn_escrever_nota')}
          className="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-safety/30 focus:border-safety" />
        <Button type="submit" disabled={sending}>{t('pn_enviar')}</Button>
      </form>
    </div>
  );
}

  const emitirNotaFiscal = async () => {
    setNfError('');
    if (!company?.emite_facil_api_key) return;
    setEmittingNF(true);
    try {
      const resp = await fetch('https://anbvaoegvvjqcfhurpet.supabase.co/functions/v1/criar-pedido-externo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chave_api: company.emite_facil_api_key,
          cliente_nome: project.client_name || project.title,
          obra_nome: project.title,
          endereco: project.address || null,
          valor: Number(project.amount_to_receive || project.budget || 0),
          referencia_externa: project.id,
        }),
      });
      const data = await resp.json();
      if (resp.status === 401) {
        throw new Error(t('nf_erro_401'));
      }
      if (!resp.ok) {
        throw new Error(data.error || t('nf_erro_generico'));
      }
      await db.from('projects').update({
        nf_link: data.link,
        nf_pedido_id: data.pedido_id,
        nf_created_at: new Date().toISOString(),
      }).eq('id', project.id);
      onChanged({ ...project, nf_link: data.link, nf_pedido_id: data.pedido_id });
    } catch (err) {
      setNfError(err.message === 'Failed to fetch'

    if (project.tax_rate_snapshot) {

          <PageHeader title={`Olá, ${profile.full_name.split(' ')[0]}`} subtitle="Clique em uma obra para ver os detalhes, deixar notas ou solicitar alterações" />
          {projects.length === 0 ? (
            <EmptyState icon="briefcase" title="Nenhuma obra atribuída ainda" subtitle="Quando o administrador adicionar você a uma equipe de obra, ela vai aparecer aqui." />
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {projects.map(p => {
                const teamRow = team.find(t => t.project_id === p.id);
                const pendingRequest = requests.find(r => r.project_id === p.id && r.status === 'pendente');
                return (
                  <div key={p.id} onClick={() => setViewingProject(p)}
                    className="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm hover:shadow-md transition-shadow cursor-pointer">
                    <div className="flex items-start justify-between mb-2">
                      <div className="font-display font-semibold text-blueprint">{p.title}</div>
                      <StatusBadge status={p.status} />
                    </div>
                    <div className="text-sm text-slate-500 mb-3 line-clamp-2">{p.description}</div>
                    <div className="text-xs text-slate-400 flex items-center gap-1 mb-2"><Icon path={ICONS.pin} className="w-3.5 h-3.5"/>{p.address || 'Sem endereço'}</div>
                    <div className="text-xs text-slate-400 mb-2">{fmtDate(p.start_date)} → {fmtDate(p.end_date)}</div>
                    {teamRow && teamRow.payment_type !== 'salario' && (
                      <div className="font-mono text-sm text-blueprint border-t border-slate-100 pt-2 mt-1">
                        A receber: {fmtCurrency(teamRow.payment_value)}
                        {pendingRequest && <span className="ml-2 text-xs text-amber-600 font-sans">· alteração pendente</span>}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}

      {page === 'dashboard' && (
        <>
          <PageHeader title="Meu dashboard" subtitle="Seu histórico de obras e pagamentos" />
          <EmployeeDashboard employee={employee} team={team} salaryPayments={salaryPayments} projects={projects} />
        </>
      )}

      {page === 'notificacoes' && (
        <>
          <PageHeader title={t('notif_title')} subtitle={t('notif_subtitle_emp')} />
          {noteNotifications.length === 0 ? (
            <EmptyState icon="bell" title={t('notif_vazio_titulo_emp')} subtitle={t('notif_vazio_subtitulo_emp')} />
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {noteNotifications.map(n => {
                const relatedProject = projects.find(p => p.id === n.project_id);
                return (
                  <div key={n.id}
                    onClick={async () => {
                      await db.from('note_notifications').update({ is_read: true }).eq('id', n.id);
                      if (relatedProject) setViewingProject(relatedProject);
                      loadData();
                    }}
                    className={`bg-white rounded-2xl border p-5 shadow-sm hover:shadow-md transition-shadow cursor-pointer ${!n.is_read ? 'border-safety/30 bg-safety/5' : 'border-slate-100'}`}>
                    <div className="flex items-start justify-between mb-2">
                      <div className="font-display font-semibold text-blueprint">{n.author_name}</div>
                      {!n.is_read && <span className="w-2 h-2 rounded-full bg-safety flex-shrink-0 mt-1.5"></span>}
                    </div>
                    <div className="text-xs text-slate-400 mb-2 flex items-center gap-1">
                      <Icon path={ICONS.briefcase} className="w-3.5 h-3.5" />{n.project_title}
                    </div>
                    <div className="text-sm text-blueprint bg-slate-50 rounded-xl px-3 py-2 italic">"{n.message_preview}"</div>
                    <div className="text-xs text-slate-400 mt-2 flex items-center justify-between">
                      <span>{new Date(n.created_at).toLocaleString(t('sal_locale'), { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</span>
                      <span className="text-safety text-xs font-medium">{t('notif_abrir_obra')}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}

      {viewingProject && (
        <EmployeeProjectDetailModal
          project={viewingProject}
          profile={profile}
          employee={employee}
          teamRow={team.find(t => t.project_id === viewingProject.id)}
          pendingRequest={requests.find(r => r.project_id === viewingProject.id && r.status === 'pendente')}
          onClose={() => setViewingProject(null)}
          onChanged={() => { loadData(); }}
        />
      )}
    </AppShell>
  );
}

// ============================================================
// EMPLOYEE DASHBOARD (com filtros e histórico de pagamentos)
// ============================================================
const getPaymentTypeLabels = () => ({ empreita: t('pricing_empreita'), diaria: t('pricing_diaria'), hora: t('pricing_hora'), salario: t('pricing_salario') });
const getMonthNames = () => [
  t('month_1'), t('month_2'), t('month_3'), t('month_4'), t('month_5'), t('month_6'),
  t('month_7'), t('month_8'), t('month_9'), t('month_10'), t('month_11'), t('month_12'),
];

function EmployeeDashboard({ employee, team, salaryPayments, projects }) {
  const [filterProject, setFilterProject] = useState('all');
  const [filterMonth, setFilterMonth] = useState('all');
  const [filterYear, setFilterYear] = useState('all');

  const myProjects = projects.filter(p => team.some(t => t.project_id === p.id));
  const completedCount = myProjects.filter(p => p.status === 'entregue').length;

  const history = [];
  team.forEach(t => {
    if (t.payment_type !== 'salario') {
      history.push({
        id: 't-' + t.id,
        label: t.projects?.title || t('empd_obra_generica'),
        type: getPaymentTypeLabels()[t.payment_type],
        amount: t.payment_value,
        status: t.payment_status,
        date: t.payment_date,
        project_id: t.project_id,
      });
    }
  });
  salaryPayments.forEach(s => {
    const ref = new Date(s.reference_month + 'T00:00:00');
    history.push({
      id: 's-' + s.id,
      label: `${t('pricing_salario')} · ${getMonthNames()[ref.getMonth()]} ${ref.getFullYear()}`,
      type: t('pricing_salario'),
      amount: s.amount,
      status: s.paid ? 'pago' : 'pendente',
      date: s.paid_date || s.reference_month,
      project_id: null,
    });
  });

  const years = [...new Set(history.filter(h => h.date).map(h => h.date.slice(0, 4)))].sort().reverse();

  const filtered = history.filter(h => {
    if (filterProject !== 'all' && h.project_id !== filterProject) return false;
    if (filterYear !== 'all' && (!h.date || h.date.slice(0, 4) !== filterYear)) return false;
    if (filterMonth !== 'all' && (!h.date || h.date.slice(5, 7) !== filterMonth)) return false;
    return true;
  }).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const totalPago = filtered.filter(h => h.status === 'pago').reduce((s, h) => s + Number(h.amount || 0), 0);
  const totalPendente = filtered.filter(h => h.status === 'pendente').reduce((s, h) => s + Number(h.amount || 0), 0);

  // Dados para o gráfico: por mês (quando um ano está selecionado) ou por ano (quando "todos")
  const baseForChart = history.filter(h => h.status === 'pago' && (filterProject === 'all' || h.project_id === filterProject) && h.date);
  let chartLabels, chartValues;
  if (filterYear !== 'all') {
    const byMonth = Array(12).fill(0);
    baseForChart.filter(h => h.date.slice(0, 4) === filterYear).forEach(h => {
      byMonth[parseInt(h.date.slice(5, 7), 10) - 1] += Number(h.amount || 0);
    });
    chartLabels = getMonthNames().map(m => m.slice(0, 3));
    chartValues = byMonth;
  } else {
    const byYear = {};
    baseForChart.forEach(h => { const y = h.date.slice(0, 4); byYear[y] = (byYear[y] || 0) + Number(h.amount || 0); });
    chartLabels = Object.keys(byYear).sort();
    chartValues = chartLabels.map(y => byYear[y]);
  }

  return (
    <>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <StatCard icon="briefcase" label={t('empd_obras_atribuidas')} value={myProjects.length} />
        <StatCard icon="check" label={t('empd_obras_concluidas')} value={completedCount} />
        <StatCard icon={currentCurrencyIcon()} label={t('empd_total_recebido')} value={fmtCurrency(totalPago)} accent="safety" />
        <StatCard icon={currentCurrencyIcon()} label={t('empd_pendente_recebimento')} value={fmtCurrency(totalPendente)} />
      </div>

      <div className="flex flex-wrap gap-3 mb-4">
        <Select value={filterProject} onChange={e => setFilterProject(e.target.value)}>
          <option value="all">{t('empd_todas_obras')}</option>
          {myProjects.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
        </Select>
        <Select value={filterYear} onChange={e => setFilterYear(e.target.value)}>
          <option value="all">{t('empd_todos_anos')}</option>
          {years.map(y => <option key={y} value={y}>{y}</option>)}
        </Select>
        <Select value={filterMonth} onChange={e => setFilterMonth(e.target.value)}>
          <option value="all">{t('empd_todos_meses')}</option>
          {getMonthNames().map((m, i) => <option key={i} value={String(i + 1).padStart(2, '0')}>{m}</option>)}
        </Select>
      </div>

      <ChartCard title={filterYear !== 'all' ? t('empd_recebimentos_mes')(filterYear) : t('empd_recebimentos_ano')}>
        <ChartCanvas config={{
          type: 'bar',
          data: {
            labels: chartLabels,
            datasets: [{ label: t('fin_status_recebido'), data: chartValues, backgroundColor: '#F2641A', borderRadius: 6 }],
          },
          options: {
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { callback: v => fmtCurrency(v) } } },
          },
        }} height={220} />
      </ChartCard>

      <h2 className="font-display font-semibold text-lg mb-4 mt-8">{t('empd_historico_pagamentos')}</h2>
      {filtered.length === 0 ? (
        <EmptyState icon={currentCurrencyIcon()} title={t('empd_vazio_titulo')} subtitle={t('empd_vazio_subtitulo')} />
      ) : (
        <div className="space-y-2">
          {filtered.map(h => (
            <div key={h.id} className="flex items-center justify-between bg-white border border-slate-100 rounded-xl px-4 py-3">
              <div>
                <div className="text-sm font-medium text-blueprint">{h.label}</div>
                <div className="text-xs text-slate-400">{h.type}{h.date ? ` · ${fmtDate(h.date)}` : ''}</div>
              </div>
              <div className="text-right">
                <div className="font-mono text-sm text-blueprint">{fmtCurrency(h.amount)}</div>
                <div className={`text-xs ${h.status === 'pago' ? 'text-emerald-600' : 'text-amber-600'}`}>{h.status === 'pago' ? t('fin_status_recebido') : t('fin_status_pendente')}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

// ============================================================
// EMPLOYEE PROJECT DETAIL MODAL
// ============================================================
function EmployeeProjectDetailModal({ project, profile, employee, teamRow, pendingRequest, onClose, onChanged }) {
  const [editing, setEditing] = useState(false);
  const [newValue, setNewValue] = useState(teamRow?.payment_value || '');
  const [submitting, setSubmitting] = useState(false);
  const [changingStatus, setChangingStatus] = useState(false);
  const [statusError, setStatusError] = useState('');

  const paymentTypeLabels = { empreita: t('pricing_empreita'), diaria: t('pricing_diaria'), hora: t('pricing_hora'), salario: t('pricing_salario') };
  const canRequestChange = teamRow && teamRow.payment_type !== 'salario';

  const changeStatus = async (newStatus) => {
    if (newStatus === project.status) return;
    setChangingStatus(true);
    setStatusError('');
    const { error } = await db.rpc('update_project_status', { p_project_id: project.id, p_status: newStatus });
    setChangingStatus(false);
    if (error) { setStatusError(t('epd_erro_status')); return; }
    onChanged();
  };

  const submitRequest = async (e) => {
    e.preventDefault();
    setSubmitting(true);
    await db.from('value_change_requests').insert({
      company_id: project.company_id,
      project_id: project.id,
      employee_id: employee.id,
      project_team_id: teamRow.id,
      requested_by: profile.id,
      old_value: teamRow.payment_value,
      new_value: parseFloat(newValue),
    });
    setSubmitting(false);
    setEditing(false);
    onChanged();
  };

  return (
    <Modal title={project.title} onClose={onClose} wide>
      <div className="space-y-5">
        <div className="flex items-start justify-between flex-wrap gap-3">
          <div className="text-sm text-slate-400 flex items-center gap-1">
            <Icon path={ICONS.pin} className="w-4 h-4"/>
            {project.address ? (
              <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(project.address)}`} target="_blank" rel="noopener noreferrer" className="hover:text-safety underline">{project.address}</a>
            ) : t('epd_sem_endereco')}
          </div>
          <StatusBadge status={project.status} />
        </div>

        <div className="bg-slate-50 rounded-xl p-4">
          <div className="text-xs text-slate-400 mb-2">{t('epd_status_obra')}</div>
          <select
            value={project.status}
            disabled={changingStatus}
            onChange={e => changeStatus(e.target.value)}
            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-safety/40 disabled:opacity-60">
            {Object.keys(STATUS_CONFIG).map(key => (
              <option key={key} value={key}>{t('status_' + key)}</option>
            ))}
          </select>
          {changingStatus && <div className="text-xs text-slate-400 mt-1">{t('epd_atualizando')}</div>}
          {statusError && <div className="text-xs text-red-500 mt-1">{statusError}</div>}
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div className="bg-slate-50 rounded-xl p-4">
            <div className="text-xs text-slate-400 mb-1">{t('epd_trabalhos_realizar')}</div>
            <div className="text-sm text-blueprint">{project.work_to_do || '—'}</div>
          </div>
          <div className="bg-slate-50 rounded-xl p-4">
            <div className="text-xs text-slate-400 mb-1">{t('epd_prazo')}</div>
            <div className="text-sm text-blueprint">{fmtDate(project.start_date)} → {fmtDate(project.end_date)}</div>
          </div>
        </div>

        {project.description && (
          <div className="bg-slate-50 rounded-xl p-4">
            <div className="text-xs text-slate-400 mb-1">{t('epd_descricao_servico')}</div>
            <div className="text-sm text-blueprint">{project.description}</div>
          </div>
        )}

        {project.service_type && (
          <div className="bg-slate-50 rounded-xl p-4">
            <div className="text-xs text-slate-400 mb-1">{t('epd_tipo_servico')}</div>
            <div className="text-sm text-blueprint font-medium">{getServiceTypes()[project.service_type]}</div>
          </div>
        )}

        {teamRow && (
          <div>
            <h4 className="font-display font-semibold text-sm mb-2">{t('epd_seu_valor')}</h4>
            <div className="bg-white border border-slate-100 rounded-xl p-4">
              <div className="flex items-center justify-between mb-1">
                <span className="text-xs text-slate-400">
                  {paymentTypeLabels[teamRow.payment_type]}
                  {teamRow.payment_type === 'diaria' && teamRow.daily_rate != null && teamRow.num_days != null
                    ? ` · ${fmtCurrency(teamRow.daily_rate)} × ${teamRow.num_days} ${teamRow.num_days === 1 ? t('pd_dia') : t('pd_dias')}`
                    : ''}
                </span>
                <span className="font-mono text-lg text-blueprint">{fmtCurrency(teamRow.payment_value)}</span>
              </div>

              {canRequestChange && (
                pendingRequest ? (
                  <div className="text-sm text-amber-700 bg-amber-50 rounded-xl px-3 py-2 mt-2">
                    {t('epd_solicitacao_enviada')(fmtCurrency(pendingRequest.old_value), fmtCurrency(pendingRequest.new_value))}
                  </div>
                ) : editing ? (
                  <form onSubmit={submitRequest} className="flex gap-2 mt-2">
                    <Input type="number" step="0.01" required value={newValue} onChange={e => setNewValue(e.target.value)} className="flex-1" />
                    <Button type="submit" disabled={submitting}>{t('epd_enviar')}</Button>
                    <Button type="button" variant="outline" onClick={() => setEditing(false)}>{t('epd_cancelar')}</Button>
                  </form>
                ) : (
                  <button onClick={() => setEditing(true)} className="text-xs text-safety font-medium mt-2 hover:underline">
                    {t('epd_solicitar_alteracao')}
                  </button>
                )
              )}
            </div>
          </div>
        )}

        <ProjectNotes project={project} profile={profile} />
      </div>
    </Modal>
  );
}

// ============================================================
// ROOT APP
// ============================================================
function App() {
  const [session, setSession] = useState(undefined); // undefined = loading
  const [profile, setProfile] = useState(null);
  const [recovery, setRecovery] = useState(false);
  const [route, setRoute] = useState(window.location.hash);

  useEffect(() => {
    const onHash = () => setRoute(window.location.hash);
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  useEffect(() => {
    db.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = db.auth.onAuthStateChange((_event, sess) => {
      if (_event === 'PASSWORD_RECOVERY') setRecovery(true);
      setSession(sess);
      if (!sess) setProfile(null);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (session) {
      db.from('profiles').select('*').eq('id', session.user.id).single().then(({ data, error }) => {
        setProfile(data || null);
      });
    }
  }, [session]);

  if (recovery) return <ResetPasswordPage onDone={() => setRecovery(false)} />;

  if (route === '#planos' || route === '#br' || route === '#es' || route === '#us') {
    const mode = route === '#br' ? 'br' : route === '#es' ? 'es' : route === '#us' ? 'us' : 'generic';
    return <LandingPage key={mode} mode={mode} onBackToLogin={() => { window.location.hash = ''; }} />;
  }

  if (session === undefined) return <Spinner />;
  if (!session) return <LoginPage />;
  if (!profile) return <Spinner />;

  const handleLogout = () => db.auth.signOut();

  if (profile.role === 'programmer') return <DevArea profile={profile} onLogout={handleLogout} />;
  if (profile.role === 'admin') return <AdminArea profile={profile} onLogout={handleLogout} />;
  if (profile.role === 'employee') return <EmployeeArea profile={profile} onLogout={handleLogout} />;

  return <Spinner />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
